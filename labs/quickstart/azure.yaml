# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Azure AI Gateway quick start: "azd up" creates a gateway, a Foundry model behind an alias, and a runtime API key.
# The quick start makes a sparse clone of this folder from the main branch on GitHub and runs azd up in it.
name: aigw-quickstart
metadata:
  template: aigw-quickstart@1.0.0
infra:
  provider: bicep
  path: infra
