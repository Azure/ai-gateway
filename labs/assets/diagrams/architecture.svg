2.7-3-3z"/><text x="540" y="157" class="dg-t">MCP servers</text><text x="540" y="174" class="dg-s">Federated tools</text><text x="540" y="190" class="dg-s">Tool availability</text></g><g class="tn-magenta"><rect class="dg-box" x="302" y="224" width="356" height="52" rx="10"/><rect class="dg-chip" x="313" y="236" width="28" height="28" rx="8"/><path class="dg-ic" transform="translate(317 240) scale(0.8333)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="352" y="247" class="dg-t">Policies</text><text x="352" y="264" class="dg-s">Gateway scope or individual assets</text></g><g class="tn-magenta"><rect class="dg-pill" x="302" y="284" width="99" height="22" rx="11"/><text x="351.5" y="299" class="dg-pill-t" text-anchor="middle">Token limits</text></g><g class="tn-magenta"><rect class="dg-pill" x="407" y="284" width="99" height="22" rx="11"/><text x="456.5" y="299" class="dg-pill-t" text-anchor="middle">Request rate</text></g><g class="tn-magenta"><rect class="dg-pill" x="512" y="284" width="86" height="22" rx="11"/><text x="555" y="299" class="dg-pill-t" text-anchor="middle">Cost limit</text></g><g class="tn-magenta"><rect class="dg-pill" x="302" y="312" width="112" height="22" rx="11"/><text x="358" y="327" class="dg-pill-t" text-anchor="middle">Content safety</text></g><g class="tn-magenta"><rect class="dg-pill" x="420" y="312" width="79" height="22" rx="11"/><text x="459.5" y="327" class="dg-pill-t" text-anchor="middle">IP filter</text></g><g class="tn-magenta"><rect class="dg-pill" x="505" y="312" width="131" height="22" rx="11"/><text x="570.5" y="327" class="dg-pill-t" text-anchor="middle">Threat protection</text></g><g class="tn-green"><rect class="dg-box" x="302" y="346" width="356" height="60" rx="10"/><rect class="dg-chip" x="313" y="359" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(320 366) scale(0.8333)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="358" y="373" class="dg-t">Observability</text><text x="358" y="390" class="dg-s">OpenTelemetry metrics, logs, and traces</text></g><g class="tn-azure"><rect class="dg-zone" x="714" y="20" width="230" height="220" rx="16"/><path class="dg-ic" transform="translate(730 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="752" y="43" class="dg-cap">MODEL PROVIDERS</text></g><circle class="dg-dot tn-azure" cx="736" cy="60" r="3.5"/><text x="746" y="64" class="dg-t">Microsoft Foundry</text><circle class="dg-dot tn-azure" cx="736" cy="83" r="3.5"/><text x="746" y="87" class="dg-t">Azure OpenAI</text><circle class="dg-dot tn-azure" cx="736" cy="106" r="3.5"/><text x="746" y="110" class="dg-t">OpenAI</text><circle class="dg-dot tn-azure" cx="736" cy="129" r="3.5"/><text x="746" y="133" class="dg-t">Anthropic</text><circle class="dg-dot tn-azure" cx="736" cy="152" r="3.5"/><text x="746" y="156" class="dg-t">AWS Bedrock</text><circle class="dg-dot tn-azure" cx="736" cy="175" r="3.5"/><text x="746" y="179" class="dg-t">Google Vertex AI</text><circle class="dg-dot tn-azure" cx="736" cy="198" r="3.5"/><text x="746" y="202" class="dg-t">Custom endpoints</text><g class="tn-amber"><rect class="dg-zone" x="714" y="252" width="230" height="178" rx="16"/><path class="dg-ic" transform="translate(730 262) scale(0.6667)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="752" y="275" class="dg-cap">TOOL SOURCES</text></g><circle class="dg-dot tn-amber" cx="736" cy="292" r="3.5"/><text x="746" y="296" class="dg-t">Remote MCP servers</text><circle class="dg-dot tn-amber" cx="736" cy="317" r="3.5"/><text x="746" y="321" class="dg-t">OpenAPI specifications</text><circle class="dg-dot tn-amber" cx="736" cy="342" r="3.5"/><text x="746" y="346" class="dg-t">Built-in connectors</text><circle class="dg-dot tn-amber" cx="736" cy="367" r="3.5"/><text x="746" y="371" class="dg-t">Foundry Toolbox</text><g class="tn-azure"><path class="dg-line" d="