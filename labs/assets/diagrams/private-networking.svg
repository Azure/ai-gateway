<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" data-name="private-networking">
<title id="title">Private networking for Azure AI Gateway</title>
<desc id="desc">Inbound, clients in your virtual network reach the gateway through a private endpoint with group ID Gateway, resolved by the privatelink.azure-api.net private DNS zone, and public network access is disabled. Outbound, VNet integration sends backend traffic through an integration subnet of at least /27 delegated to Microsoft.Web/serverFarms.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="430"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="274" height="330" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 3h6v5H9z M12 8v4 M5 12h14 M5 12v3 M19 12v3 M12 12v3 M3 15h4v5H3z M10 15h4v5h-4z M17 15h4v5h-4z"/><text x="54" y="43" class="dg-cap">YOUR VIRTUAL NETWORK</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="56" width="250" height="64" rx="10"/><rect class="dg-chip" x="39" y="71" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 78) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="85" class="dg-t">App or agent</text><text x="84" y="102" class="dg-s">Calls the gateway hostname</text></g><g class="tn-azure"><path class="dg-line" d="M153 122 V146" marker-end="url(#ah)"/><path class="dg-flow" d="M153 122 V146"/></g><g class="tn-azure"><rect class="dg-box-tn" x="28" y="150" width="250" height="72" rx="10"/><rect class="dg-chip" x="39" y="169" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 176) scale(0.8333)" d="M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/><text x="84" y="183" class="dg-t">Private endpoint</text><text x="84" y="200" class="dg-m">groupId: Gateway</text></g><path class="dg-ghost" d="M153 224 V250"/><g class="tn-azure"><rect class="dg-box" x="28" y="252" width="250" height="72" rx="10"/><rect class="dg-chip" x="39" y="271" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 278) scale(0.8333)" d="M4 5h16v5H4z M4 14h16v5H4z M7 7.5h3 M7 16.5h3 M15 7.5h.01 M15 16.5h.01"/><text x="84" y="285" class="dg-t">Private DNS zone</text><text x="84" y="302" class="dg-m">privatelink.azure-api.net</text></g><g class="tn-violet"><rect class="dg-gw" x="334" y="20" width="292" height="330" rx="16"/><path class="dg-ic" transform="translate(350 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="372" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="350" y="56" width="268" height="72" rx="10"/><rect class="dg-chip" x="361" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(368 82) scale(0.8333)" d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3 M12 15v2"/><text x="406" y="89" class="dg-t">Inbound</text><text x="406" y="106" class="dg-s">Private endpoint only</text></g><g class="tn-red"><rect class="dg-pill" x="350" y="138" width="227" height="22" rx="11"/><text x="463.5" y="153" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">publicNetworkAccess: Disabled</text></g><g class="tn-green"><rect class="dg-box-tn" x="350" y="252" width="268" height="72" rx="10"/><rect class="dg-chip" x="361" y="271" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(368 278) scale(0.8333)" d="M9 3h6v5H9z M12 8v4 M5 12h14 M5 12v3 M19 12v3 M12 12v3 M3 15h4v5H3z M10 15h4v5h-4z M17 15h4v5h-4z"/><text x="406" y="277" class="dg-t">Outbound</text><text x="406" y="294" class="dg-s">VNet integration</text><text x="406" y="310" class="dg-m">virtualNetworkType: External</text></g><g class="tn-azure"><path class="dg-line" d="M280 186 C314 186 314 92 346 92" marker-end="url(#ah)"/><path class="dg-flow" d="M280 186 C314 186 314 92 346 92"/></g><g class="tn-green"><rect class="dg-zone" x="670" y="20" width="274" height="330" rx="16"/><path class="dg-ic" transform="translate(686 30) scale(0.6667)" d="M9 3h6v5H9z M12 8v4 M5 12h14 M5 12v3 M19 12v3 M12 12v3 M3 15h4v5H3z M10 15h4v5h-4z M17 15h4v5h-4z"/><text x="708" y="43" class="dg-cap">INTEGRATION SUBNET</text></g><text x="686" y="60" class="dg-s">At least /27, delegated to</text><text x="686" y="78" class="dg-m">Microsoft.Web/serverFarms</text><g class="tn-green"><rect class="dg-box" x="682" y="100" width="250" height="72" rx="10"/><rect class="dg-chip" x="693" y="119" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(700 126) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="738" y="125" class="dg-t">Private backends</text><text x="738" y="142" class="dg-s">Foundry and Azure OpenAI</text><text x="738" y="158" class="dg-s">through private endpoints</text></g><text x="686" y="212" class="dg-cap">NSG: ALLOW OUTBOUND 443 TO</text><g class="tn-green"><rect class="dg-pill" x="682" y="222" width="66" height="22" rx="11"/><text x="715" y="237" class="dg-pill-t" text-anchor="middle">Storage</text></g><g class="tn-green"><rect class="dg-pill" x="754" y="222" width="105" height="22" rx="11"/><text x="806.5" y="237" class="dg-pill-t" text-anchor="middle">AzureKeyVault</text></g><g class="tn-green"><path class="dg-line" d="M620 288 C648 288 648 136 678 136" marker-end="url(#ah)"/><path class="dg-flow" d="M620 288 C648 288 648 136 678 136"/></g><g class="tn-red"><path class="dg-ic" transform="translate(16 372) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M5.6 5.6l12.8 12.8"/></g><text x="44" y="387" class="dg-s">Calls from the public internet are rejected once public network access is disabled.</text><g class="tn-amber"><path class="dg-ic" transform="translate(16 400) scale(0.8333)" d="M4 5h16v5H4z M4 14h16v5H4z M7 7.5h3 M7 16.5h3 M15 7.5h.01 M15 16.5h.01"/></g><text x="44" y="415" class="dg-s">DNS is the most common pitfall: the gateway hostname must resolve to the private endpoint IP.</text>
</g></svg>
