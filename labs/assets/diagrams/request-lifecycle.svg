<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc" data-name="request-lifecycle">
<title id="title">Request lifecycle through Azure AI Gateway</title>
<desc id="desc">A request is authenticated, checked by IP filter, rate and token limits, cost limit and content safety, then routed by alias to a backend model using the gateway managed identity. The response is screened and telemetry is recorded. A blocked request returns 401, 403, 429 or 400 and never reaches the backend.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="360"/>
<g class="tn-violet"><rect class="dg-gw" x="120" y="16" width="640" height="308" rx="16"/><path class="dg-ic" transform="translate(136 26) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="158" y="39" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="130" width="56" height="56" rx="14"/><rect class="dg-chip" x="34" y="136" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(43 145) scale(1.0833)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="56" y="204" class="dg-t" text-anchor="middle" style="font-size:12.5px">Client</text><text x="56" y="220" class="dg-s" text-anchor="middle" style="font-size:11px">app or agent</text></g><g class="tn-violet"><rect class="dg-box-tn" x="152" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="158" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(167 75) scale(1.0833)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="180" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Authenticate</text><text x="180" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">key or Entra</text></g><g class="tn-red"><rect class="dg-pill" x="158" y="162" width="44" height="22" rx="11"/><text x="180" y="177" class="dg-pill-t" text-anchor="middle">401</text></g><g class="tn-violet"><path class="dg-line" d="M211 88 H245" marker-end="url(#ah)"/><path class="dg-flow" d="M211 88 H245"/></g><g class="tn-violet"><rect class="dg-box-tn" x="248" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="254" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(263 75) scale(1.0833)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="276" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">IP filter</text><text x="276" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">allow · deny</text></g><g class="tn-red"><rect class="dg-pill" x="254" y="162" width="44" height="22" rx="11"/><text x="276" y="177" class="dg-pill-t" text-anchor="middle">403</text></g><g class="tn-violet"><path class="dg-line" d="M307 88 H341" marker-end="url(#ah)"/><path class="dg-flow" d="M307 88 H341"/></g><g class="tn-violet"><rect class="dg-box-tn" x="344" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="350" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(359 75) scale(1.0833)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="372" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Limits</text><text x="372" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">rate · tokens</text></g><g class="tn-amber"><rect class="dg-pill" x="350" y="162" width="44" height="22" rx="11"/><text x="372" y="177" class="dg-pill-t" text-anchor="middle">429</text></g><g class="tn-violet"><path class="dg-line" d="M403 88 H437" marker-end="url(#ah)"/><path class="dg-flow" d="M403 88 H437"/></g><g class="tn-violet"><rect class="dg-box-tn" x="440" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="446" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(455 75) scale(1.0833)" d="M12 10c3.9 0 7-1.3 7-3s-3.1-3-7-3-7 1.3-7 3 3.1 3 7 3z M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7 M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/><text x="468" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Cost limit</text><text x="468" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">budget</text></g><g class="tn-red"><rect class="dg-pill" x="446" y="162" width="44" height="22" rx="11"/><text x="468" y="177" class="dg-pill-t" text-anchor="middle">403</text></g><g class="tn-violet"><path class="dg-line" d="M499 88 H533" marker-end="url(#ah)"/><path class="dg-flow" d="M499 88 H533"/></g><g class="tn-violet"><rect class="dg-box-tn" x="536" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="542" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(551 75) scale(1.0833)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="564" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Content safety</text><text x="564" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">prompt</text></g><g class="tn-amber"><rect class="dg-pill" x="542" y="162" width="44" height="22" rx="11"/><text x="564" y="177" class="dg-pill-t" text-anchor="middle">400</text></g><g class="tn-violet"><path class="dg-line" d="M595 88 H629" marker-end="url(#ah)"/><path class="dg-flow" d="M595 88 H629"/></g><g class="tn-violet"><rect class="dg-box-tn" x="632" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="638" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(647 75) scale(1.0833)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="660" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Alias routing</text><text x="660" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">alias → model</text></g><g class="tn-violet"><path class="dg-line" d="M86 150 C118 150 118 88 148 88" marker-end="url(#ah)"/><path class="dg-flow" d="M86 150 C118 150 118 88 148 88"/></g><g class="tn-azure"><rect class="dg-box" x="840" y="130" width="56" height="56" rx="14"/><rect class="dg-chip" x="846" y="136" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(855 145) scale(1.0833)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="868" y="204" class="dg-t" text-anchor="middle" style="font-size:12.5px">Backend model</text><text x="868" y="220" class="dg-s" text-anchor="middle" style="font-size:11px">managed identity</text></g><g class="tn-azure"><path class="dg-line" d="M692 88 C790 88 800 150 836 150" marker-end="url(#ah)"/><path class="dg-flow" d="M692 88 C790 88 800 150 836 150"/></g><g class="tn-green"><rect class="dg-box-tn" x="612" y="212" width="56" height="56" rx="14"/><rect class="dg-chip" x="618" y="218" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(627 227) scale(1.0833)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="640" y="286" class="dg-t" text-anchor="middle" style="font-size:12.5px">Content safety</text><text x="640" y="302" class="dg-s" text-anchor="middle" style="font-size:11px">response</text></g><g class="tn-green"><rect class="dg-box-tn" x="412" y="212" width="56" height="56" rx="14"/><rect class="dg-chip" x="418" y="218" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(427 227) scale(1.0833)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="440" y="286" class="dg-t" text-anchor="middle" style="font-size:12.5px">Telemetry</text><text x="440" y="302" class="dg-s" text-anchor="middle" style="font-size:11px">tokens · cost · traces</text></g><g class="tn-green"><path class="dg-line" d="M838 172 C790 172 770 240 672 240" marker-end="url(#ah)"/><path class="dg-flow" d="M838 172 C790 172 770 240 672 240"/></g><g class="tn-green"><path class="dg-line" d="M608 240 H472" marker-end="url(#ah)"/><path class="dg-flow" d="M608 240 H472"/></g><g class="tn-green"><path class="dg-line" d="M408 240 C250 240 130 176 90 172" marker-end="url(#ah)"/><path class="dg-flow" d="M408 240 C250 240 130 176 90 172"/></g><text x="440" y="350" class="dg-s" text-anchor="middle">Blocked requests stop at the failing policy and never reach the backend.</text>
</g></svg>
