<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" data-name="aliases">
<title id="title">Model aliases decouple clients from backend models</title>
<desc id="desc">Clients call stable aliases such as chat, chat-batch and reasoning. Each alias points to a backend model and carries its own policies. Two aliases can share a backend model. Retargeting an alias to another backend model needs no client change.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="420"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="214" height="360" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-violet"><rect class="dg-gw" x="290" y="20" width="280" height="360" rx="16"/><path class="dg-ic" transform="translate(306 30) scale(0.6667)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="328" y="43" class="dg-cap-tn">ALIASES</text></g><g class="tn-azure"><rect class="dg-zone" x="636" y="20" width="308" height="360" rx="16"/><path class="dg-ic" transform="translate(652 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="674" y="43" class="dg-cap">BACKEND MODELS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="60" width="190" height="60" rx="10"/><rect class="dg-chip" x="39" y="73" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 80) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="87" class="dg-t">Chat app</text><text x="84" y="104" class="dg-m">model: chat</text></g><g class="tn-violet"><path class="dg-line" d="M220 90 H302" marker-end="url(#ah)"/><path class="dg-flow" d="M220 90 H302"/></g><g class="tn-violet"><rect class="dg-box-tn" x="306" y="58" width="248" height="64" rx="10"/><rect class="dg-chip" x="317" y="73" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(324 80) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="362" y="87" class="dg-t">chat</text><text x="362" y="104" class="dg-s">Token rate limit</text></g><g class="tn-azure"><rect class="dg-box" x="652" y="60" width="276" height="60" rx="10"/><rect class="dg-chip" x="663" y="73" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(670 80) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="708" y="87" class="dg-t">gpt-4.1-mini</text><text x="708" y="104" class="dg-s">Microsoft Foundry</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="170" width="190" height="60" rx="10"/><rect class="dg-chip" x="39" y="183" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 190) scale(0.8333)" d="M4 4h16v6H4z M4 14h16v6H4z M8 7h.01 M8 17h.01"/><text x="84" y="197" class="dg-t">Batch job</text><text x="84" y="214" class="dg-m">model: chat-batch</text></g><g class="tn-violet"><path class="dg-line" d="M220 200 H302" marker-end="url(#ah)"/><path class="dg-flow" d="M220 200 H302"/></g><g class="tn-violet"><rect class="dg-box-tn" x="306" y="168" width="248" height="64" rx="10"/><rect class="dg-chip" x="317" y="183" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(324 190) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="362" y="197" class="dg-t">chat-batch</text><text x="362" y="214" class="dg-s">Token rate limit · Cost limit</text></g><g class="tn-azure"><rect class="dg-box" x="652" y="170" width="276" height="60" rx="10"/><rect class="dg-chip" x="663" y="183" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(670 190) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="708" y="197" class="dg-t">gpt-4.1</text><text x="708" y="214" class="dg-s">Microsoft Foundry</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="280" width="190" height="60" rx="10"/><rect class="dg-chip" x="39" y="293" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 300) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="84" y="307" class="dg-t">Research agent</text><text x="84" y="324" class="dg-m">model: reasoning</text></g><g class="tn-violet"><path class="dg-line" d="M220 310 H302" marker-end="url(#ah)"/><path class="dg-flow" d="M220 310 H302"/></g><g class="tn-violet"><rect class="dg-box-tn" x="306" y="278" width="248" height="64" rx="10"/><rect class="dg-chip" x="317" y="293" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(324 300) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="362" y="307" class="dg-t">reasoning</text><text x="362" y="324" class="dg-s">Content safety</text></g><g class="tn-azure"><rect class="dg-box" x="652" y="280" width="276" height="60" rx="10"/><rect class="dg-chip" x="663" y="293" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(670 300) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="708" y="307" class="dg-t">o4-mini</text><text x="708" y="324" class="dg-s">Microsoft Foundry</text></g><g class="tn-violet"><path class="dg-line" d="M556 90 C600 90 610 86 648 86" marker-end="url(#ah)"/><path class="dg-flow" d="M556 90 C600 90 610 86 648 86"/></g><g class="tn-magenta"><path class="dg-line" d="M556 200 C606 200 606 98 648 98" marker-end="url(#ah)"/><path class="dg-flow" d="M556 200 C606 200 606 98 648 98"/></g><g class="tn-cyan"><path class="dg-line" d="M556 310 C600 310 610 310 648 310" marker-end="url(#ah)"/><path class="dg-flow" d="M556 310 C600 310 610 310 648 310"/></g><g class="tn-violet"><path class="dg-dash" d="M556 96 C606 104 606 196 648 196" marker-end="url(#ah)"/></g><rect x="573.04" y="137" width="61.92" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="604" y="150" class="dg-m" text-anchor="middle">retarget</text><text x="16" y="404" class="dg-s">Dashed: retarget chat to gpt-4.1. Clients keep sending model: chat, and the alias keeps its policies.</text>
</g></svg>
