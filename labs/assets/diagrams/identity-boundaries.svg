<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc" data-name="identity-boundaries">
<title id="title">Identity boundaries in Azure AI Gateway</title>
<desc id="desc">Inbound, callers authenticate to the gateway with an API key or a Microsoft Entra token that carries an AI Gateway data-plane role. Outbound, the gateway calls backends with its own managed identity, or a provider API key it stores. Callers never receive backend credentials.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="360"/>
<g class="tn-azure"><rect class="dg-pill" x="197.5" y="10" width="177" height="22" rx="11"/><text x="286" y="25" class="dg-pill-t" text-anchor="middle">Inbound: who is calling?</text></g><g class="tn-green"><rect class="dg-pill" x="565.5" y="10" width="217" height="22" rx="11"/><text x="674" y="25" class="dg-pill-t" text-anchor="middle">Outbound: the gateway identity</text></g><path class="dg-ghost" d="M286 38 V324 M674 38 V324"/><g class="tn-azure"><rect class="dg-zone" x="16" y="44" width="250" height="280" rx="16"/><path class="dg-ic" transform="translate(32 54) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="67" class="dg-cap">CALLERS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="82" width="226" height="64" rx="10"/><rect class="dg-chip" x="39" y="97" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 104) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="84" y="111" class="dg-t">App with API key</text><text x="84" y="128" class="dg-s">api-key header</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="162" width="226" height="64" rx="10"/><rect class="dg-chip" x="39" y="177" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 184) scale(0.8333)" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/><text x="84" y="191" class="dg-t">User or agent</text><text x="84" y="208" class="dg-s">Entra token (delegated)</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="242" width="226" height="64" rx="10"/><rect class="dg-chip" x="39" y="257" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 264) scale(0.8333)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="84" y="271" class="dg-t">Workload</text><text x="84" y="288" class="dg-s">Managed identity token</text></g><g class="tn-violet"><rect class="dg-gw" x="306" y="44" width="348" height="280" rx="16"/><path class="dg-ic" transform="translate(322 54) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="344" y="67" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-azure"><path class="dg-line" d="M256 114 C290 114 292 124 318 124" marker-end="url(#ah)"/><path class="dg-flow" d="M256 114 C290 114 292 124 318 124"/></g><g class="tn-azure"><path class="dg-line" d="M256 194 C290 194 292 124 318 124" marker-end="url(#ah)"/><path class="dg-flow" d="M256 194 C290 194 292 124 318 124"/></g><g class="tn-azure"><path class="dg-line" d="M256 274 C290 274 292 124 318 124" marker-end="url(#ah)"/><path class="dg-flow" d="M256 274 C290 274 292 124 318 124"/></g><g class="tn-violet"><rect class="dg-box-tn" x="322" y="82" width="316" height="84" rx="10"/><rect class="dg-chip" x="333" y="107" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(340 114) scale(0.8333)" d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3 M12 15v2"/><text x="378" y="113" class="dg-t">Inbound check</text><text x="378" y="130" class="dg-s">Valid key, or an Entra token with</text><text x="378" y="146" class="dg-s">an AI Gateway data-plane role</text></g><g class="tn-violet"><rect class="dg-pill" x="322" y="176" width="118" height="22" rx="11"/><text x="381" y="191" class="dg-pill-t" text-anchor="middle">AI Gateway User</text></g><g class="tn-violet"><rect class="dg-pill" x="446" y="176" width="92" height="22" rx="11"/><text x="492" y="191" class="dg-pill-t" text-anchor="middle">Models User</text></g><g class="tn-violet"><rect class="dg-pill" x="544" y="176" width="86" height="22" rx="11"/><text x="587" y="191" class="dg-pill-t" text-anchor="middle">Tools User</text></g><g class="tn-green"><rect class="dg-box-tn" x="322" y="236" width="316" height="76" rx="10"/><rect class="dg-chip" x="333" y="257" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(340 264) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="378" y="263" class="dg-t">Outbound identity</text><text x="378" y="280" class="dg-s">System- or user-assigned</text><text x="378" y="296" class="dg-s">managed identity</text></g><g class="tn-green"><rect class="dg-zone" x="694" y="44" width="250" height="280" rx="16"/><path class="dg-ic" transform="translate(710 54) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="732" y="67" class="dg-cap">BACKENDS</text></g><g class="tn-green"><rect class="dg-box" x="706" y="82" width="226" height="84" rx="10"/><rect class="dg-chip" x="717" y="107" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(724 114) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="762" y="113" class="dg-t">Microsoft Foundry</text><text x="762" y="130" class="dg-s">Managed identity with the</text><text x="762" y="146" class="dg-s">Foundry User role</text></g><g class="tn-green"><rect class="dg-box" x="706" y="184" width="226" height="84" rx="10"/><rect class="dg-chip" x="717" y="209" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(724 216) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="762" y="215" class="dg-t">Other providers</text><text x="762" y="232" class="dg-s">Provider API key</text><text x="762" y="248" class="dg-s">stored by the gateway</text></g><g class="tn-green"><path class="dg-line" d="M640 274 C672 274 672 124 702 124" marker-end="url(#ah)"/><path class="dg-flow" d="M640 274 C672 274 672 124 702 124"/></g><g class="tn-green"><path class="dg-line" d="M640 274 C672 274 672 226 702 226" marker-end="url(#ah)"/><path class="dg-flow" d="M640 274 C672 274 672 226 702 226"/></g><text x="16" y="350" class="dg-s">Callers never receive backend credentials. Each side is authorized separately.</text>
</g></svg>
