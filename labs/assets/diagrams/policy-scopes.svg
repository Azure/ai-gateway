<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" data-name="policy-scopes">
<title id="title">Policy scopes in Azure AI Gateway</title>
<desc id="desc">Gateway-scope policies apply to all compatible assets, including assets added later. Individual-asset policies attach to a backend model, an alias or an MCP server. Every applicable policy is evaluated for a request.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="440"/>
<g class="tn-violet"><rect class="dg-gw" x="16" y="16" width="928" height="408" rx="16"/><path class="dg-ic" transform="translate(32 26) scale(0.6667)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="54" y="39" class="dg-cap-tn">GATEWAY SCOPE · APPLIES TO ALL COMPATIBLE ASSETS, INCLUDING FUTURE ONES</text></g><g class="tn-azure"><rect class="dg-pill" x="32" y="48" width="112" height="22" rx="11"/><text x="88" y="63" class="dg-pill-t" text-anchor="middle">Content safety</text></g><g class="tn-azure"><rect class="dg-pill" x="150" y="48" width="79" height="22" rx="11"/><text x="189.5" y="63" class="dg-pill-t" text-anchor="middle">IP filter</text></g><g class="tn-azure"><rect class="dg-pill" x="235" y="48" width="86" height="22" rx="11"/><text x="278" y="63" class="dg-pill-t" text-anchor="middle">Cost limit</text></g><g class="tn-azure"><path class="dg-line" d="M139 76 V96" marker-end="url(#ah)"/><path class="dg-flow" d="M139 76 V96"/></g><g class="tn-green"><rect class="dg-zone" x="32" y="100" width="214" height="300" rx="16"/><path class="dg-ic" transform="translate(48 110) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="70" y="123" class="dg-cap">MODELS</text></g><g class="tn-green"><rect class="dg-box" x="44" y="138" width="190" height="56" rx="10"/><rect class="dg-chip" x="55" y="149" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(62 156) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="100" y="163" class="dg-t">gpt-6-luna</text><text x="100" y="180" class="dg-s">Backend model</text></g><g class="tn-green"><rect class="dg-pill" x="44" y="202" width="99" height="22" rx="11"/><text x="93.5" y="217" class="dg-pill-t" text-anchor="middle">Request rate</text></g><text x="46" y="258" class="dg-s">Applies through every alias</text><g class="tn-azure"><path class="dg-line" d="M365 76 V96" marker-end="url(#ah)"/><path class="dg-flow" d="M365 76 V96"/></g><g class="tn-violet"><rect class="dg-zone" x="258" y="100" width="214" height="300" rx="16"/><path class="dg-ic" transform="translate(274 110) scale(0.6667)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="296" y="123" class="dg-cap">ALIASES</text></g><g class="tn-violet"><rect class="dg-box" x="270" y="138" width="190" height="56" rx="10"/><rect class="dg-chip" x="281" y="149" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(288 156) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="326" y="163" class="dg-t">chat</text><text x="326" y="180" class="dg-s">→ gpt-6-luna</text></g><g class="tn-violet"><rect class="dg-pill" x="270" y="202" width="125" height="22" rx="11"/><text x="332.5" y="217" class="dg-pill-t" text-anchor="middle">Token rate limit</text></g><g class="tn-violet"><rect class="dg-box" x="270" y="266" width="190" height="56" rx="10"/><rect class="dg-chip" x="281" y="277" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(288 284) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="326" y="291" class="dg-t">chat-batch</text><text x="326" y="308" class="dg-s">→ gpt-6-luna</text></g><g class="tn-violet"><rect class="dg-pill" x="270" y="330" width="125" height="22" rx="11"/><text x="332.5" y="345" class="dg-pill-t" text-anchor="middle">Token rate limit</text></g><g class="tn-violet"><rect class="dg-pill" x="270" y="358" width="86" height="22" rx="11"/><text x="313" y="373" class="dg-pill-t" text-anchor="middle">Cost limit</text></g><g class="tn-azure"><path class="dg-line" d="M591 76 V96" marker-end="url(#ah)"/><path class="dg-flow" d="M591 76 V96"/></g><g class="tn-amber"><rect class="dg-zone" x="484" y="100" width="214" height="300" rx="16"/><path class="dg-ic" transform="translate(500 110) scale(0.6667)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="522" y="123" class="dg-cap">MCP SERVERS</text></g><g class="tn-amber"><rect class="dg-box" x="496" y="138" width="190" height="56" rx="10"/><rect class="dg-chip" x="507" y="149" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(514 156) scale(0.8333)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="552" y="163" class="dg-t">github-tools</text><text x="552" y="180" class="dg-s">MCP server</text></g><g class="tn-amber"><rect class="dg-pill" x="496" y="202" width="99" height="22" rx="11"/><text x="545.5" y="217" class="dg-pill-t" text-anchor="middle">Request rate</text></g><g class="tn-amber"><rect class="dg-pill" x="496" y="230" width="131" height="22" rx="11"/><text x="561.5" y="245" class="dg-pill-t" text-anchor="middle">Threat protection</text></g><g class="tn-azure"><path class="dg-line" d="M817 76 V96" marker-end="url(#ah)"/><path class="dg-flow" d="M817 76 V96"/></g><rect class="dg-ghost" x="710" y="100" width="214" height="300" rx="16"/><g class="tn-violet"><path class="dg-ic" transform="translate(726 110) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></g><text x="748" y="123" class="dg-cap">FUTURE ASSETS</text><rect class="dg-ghost" x="722" y="138" width="190" height="56" rx="10"/><text x="736" y="162" class="dg-t">New model or server</text><text x="736" y="180" class="dg-s">Inherits gateway policies</text><text x="32" y="416" class="dg-s">Every applicable policy is evaluated for each request. Any one of them can block it.</text>
</g></svg>
