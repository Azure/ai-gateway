<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" data-name="threat-protection">
<title id="title">Agent 365 tool threat protection</title>
<desc id="desc">An agent calls an MCP tool with a delegated Microsoft Entra token. Before invocation, Microsoft Defender and Microsoft Purview check the tool input for malicious content, prompt injection and sensitive data. If blocked, the tool never runs. After invocation they check the tool result. A denial after invocation withholds the result, but the tool already ran.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="430"/>
<g class="tn-violet"><rect class="dg-gw" x="120" y="16" width="660" height="370" rx="16"/><path class="dg-ic" transform="translate(136 26) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="158" y="39" class="dg-cap-tn">AI GATEWAY · MCP SERVER</text></g><g class="tn-cyan"><rect class="dg-box" x="28" y="130" width="56" height="56" rx="14"/><rect class="dg-chip" x="34" y="136" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(43 145) scale(1.0833)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="56" y="204" class="dg-t" text-anchor="middle" style="font-size:12.5px">Agent</text><text x="56" y="220" class="dg-s" text-anchor="middle" style="font-size:11px">calls a tool</text></g><g class="tn-violet"><rect class="dg-box-tn" x="212" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="218" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(227 75) scale(1.0833)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="240" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Entra token</text><text x="240" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">delegated (OBO)</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="422" y="60" width="56" height="56" rx="14"/><rect class="dg-chip" x="428" y="66" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(437 75) scale(1.0833)" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><text x="450" y="134" class="dg-t" text-anchor="middle" style="font-size:12.5px">Before invocation</text><text x="450" y="150" class="dg-s" text-anchor="middle" style="font-size:11px">checks tool input</text></g><g class="tn-amber"><rect class="dg-box" x="852" y="150" width="56" height="56" rx="14"/><rect class="dg-chip" x="858" y="156" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(867 165) scale(1.0833)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="880" y="224" class="dg-t" text-anchor="middle" style="font-size:12.5px">MCP tool</text><text x="880" y="240" class="dg-s" text-anchor="middle" style="font-size:11px">runs the call</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="592" y="230" width="56" height="56" rx="14"/><rect class="dg-chip" x="598" y="236" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(607 245) scale(1.0833)" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><text x="620" y="304" class="dg-t" text-anchor="middle" style="font-size:12.5px">After invocation</text><text x="620" y="320" class="dg-s" text-anchor="middle" style="font-size:11px">checks tool result</text></g><g class="tn-cyan"><path class="dg-line" d="M86 150 C140 150 160 88 208 88" marker-end="url(#ah)"/><path class="dg-flow" d="M86 150 C140 150 160 88 208 88"/></g><g class="tn-violet"><path class="dg-line" d="M270 88 H418" marker-end="url(#ah)"/><path class="dg-flow" d="M270 88 H418"/></g><g class="tn-amber"><path class="dg-line" d="M480 88 C720 88 800 120 850 160" marker-end="url(#ah)"/><path class="dg-flow" d="M480 88 C720 88 800 120 850 160"/></g><g class="tn-amber"><path class="dg-line" d="M850 192 C780 250 720 258 652 258" marker-end="url(#ah)"/><path class="dg-flow" d="M850 192 C780 250 720 258 652 258"/></g><g class="tn-cyan"><path class="dg-line" d="M588 258 C320 258 160 172 90 172" marker-end="url(#ah)"/><path class="dg-flow" d="M588 258 C320 258 160 172 90 172"/></g><g class="tn-violet"><rect class="dg-pill" x="135" y="164" width="210" height="22" rx="11"/><text x="240" y="179" class="dg-pill-t" text-anchor="middle">App-only tokens not supported</text></g><g class="tn-red"><rect class="dg-pill" x="371" y="164" width="158" height="22" rx="11"/><text x="450" y="179" class="dg-pill-t" text-anchor="middle">Deny: tool never runs</text></g><g class="tn-amber"><rect class="dg-pill" x="482" y="330" width="276" height="22" rx="11"/><text x="620" y="345" class="dg-pill-t" text-anchor="middle">Deny: result withheld, tool already ran</text></g><text x="150" y="296" class="dg-cap">DEFENDER + PURVIEW CHECK FOR</text><circle class="dg-dot tn-magenta" cx="154" cy="316" r="3.5"/><text x="164" y="320" class="dg-s">Malicious content</text><circle class="dg-dot tn-magenta" cx="154" cy="336" r="3.5"/><text x="164" y="340" class="dg-s">Prompt injection</text><circle class="dg-dot tn-magenta" cx="154" cy="356" r="3.5"/><text x="164" y="360" class="dg-s">Sensitive data</text><text x="16" y="414" class="dg-s">Choose before, after, or both. Do not auto-retry after a post-invocation denial: the side effect already happened.</text>
</g></svg>
