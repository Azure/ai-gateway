<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="title desc" data-name="provisioning">
<title id="title">What provisioning an AI Gateway creates</title>
<desc id="desc">You choose a name, a resource group, and a region where AI Gateway is available. Azure creates the AI Gateway with a system-assigned managed identity, and its companion connector gateway with the same name. There is no capacity to size. You get a runtime URL, a default workspace for model and MCP routes, and the AI Gateway portal.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="356"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="220" height="316" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/><text x="54" y="43" class="dg-cap">YOU CHOOSE</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="56" width="196" height="72" rx="10"/><rect class="dg-chip" x="39" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 82) scale(0.8333)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="84" y="81" class="dg-t">Name</text><text x="84" y="98" class="dg-s">Up to 24 characters</text><text x="84" y="114" class="dg-s">Globally unique</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="152" width="196" height="72" rx="10"/><rect class="dg-chip" x="39" y="171" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 178) scale(0.8333)" d="M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 16.5l9 5 9-5"/><text x="84" y="177" class="dg-t">Resource group</text><text x="84" y="194" class="dg-s">New or existing</text><text x="84" y="210" class="dg-s">Holds both resources</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="248" width="196" height="72" rx="10"/><rect class="dg-chip" x="39" y="267" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 274) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="84" y="273" class="dg-t">Region</text><text x="84" y="290" class="dg-s">Any available region</text><text x="84" y="306" class="dg-s">List it with the CLI</text></g><g class="tn-violet"><rect class="dg-gw" x="270" y="20" width="340" height="316" rx="16"/><path class="dg-ic" transform="translate(286 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="308" y="43" class="dg-cap-tn">AZURE CREATES</text></g><g class="tn-violet"><rect class="dg-box-tn" x="282" y="56" width="316" height="72" rx="10"/><rect class="dg-chip" x="293" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(300 82) scale(0.8333)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="338" y="81" class="dg-t">1 · AI Gateway</text><text x="338" y="98" class="dg-s">No capacity to size</text><text x="338" y="114" class="dg-m">Microsoft.ApiManagement/aigateways</text></g><g class="tn-violet"><path class="dg-line" d="M440 130 V150" marker-end="url(#ah)"/></g><g class="tn-violet"><rect class="dg-box" x="282" y="152" width="316" height="72" rx="10"/><rect class="dg-chip" x="293" y="171" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(300 178) scale(0.8333)" d="M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/><text x="338" y="177" class="dg-t">2 · Connector gateway</text><text x="338" y="194" class="dg-s">Same name, companion resource</text><text x="338" y="210" class="dg-m">Microsoft.Web/connectorGateways</text></g><g class="tn-green"><rect class="dg-box" x="282" y="248" width="316" height="72" rx="10"/><rect class="dg-chip" x="293" y="267" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(300 274) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="338" y="273" class="dg-t">Managed identity</text><text x="338" y="290" class="dg-s">System-assigned, on by default</text><text x="338" y="306" class="dg-s">Calls backends without keys</text></g><g class="tn-green"><rect class="dg-zone" x="644" y="20" width="300" height="316" rx="16"/><path class="dg-ic" transform="translate(660 30) scale(0.6667)" d="M5 12.5l4.5 4.5L19 7"/><text x="682" y="43" class="dg-cap">YOU GET</text></g><g class="tn-green"><rect class="dg-box" x="656" y="56" width="276" height="72" rx="10"/><rect class="dg-chip" x="667" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(674 82) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="712" y="81" class="dg-t">Runtime URL</text><text x="712" y="98" class="dg-m">https://&lt;gateway&gt;.eastus2-01</text><text x="712" y="114" class="dg-m">.ai.gateway.azure.com</text></g><g class="tn-green"><rect class="dg-box" x="656" y="152" width="276" height="72" rx="10"/><rect class="dg-chip" x="667" y="171" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(674 178) scale(0.8333)" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/><text x="712" y="177" class="dg-t">Default workspace</text><text x="712" y="194" class="dg-m">/default/models/…</text><text x="712" y="210" class="dg-m">/default/toolservers/…</text></g><g class="tn-green"><rect class="dg-box" x="656" y="248" width="276" height="72" rx="10"/><rect class="dg-chip" x="667" y="267" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(674 274) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="712" y="273" class="dg-t">AI Gateway portal</text><text x="712" y="290" class="dg-s">Home shows a setup guide</text><text x="712" y="306" class="dg-m">ai.gateway.azure.com</text></g><g class="tn-azure"><path class="dg-line" d="M236 188 H266" marker-end="url(#ah)"/><path class="dg-flow" d="M236 188 H266"/></g><g class="tn-green"><path class="dg-line" d="M610 188 H640" marker-end="url(#ah)"/><path class="dg-flow" d="M610 188 H640"/></g>
</g></svg>
