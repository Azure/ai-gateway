name: Azure CLI extension CI

on:
  pull_request:
    paths:
      - ".github/workflows/azure-cli-extension-*.yml"
      - "src/ai-gateway/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/azure-cli-extension-*.yml"
      - "src/ai-gateway/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build tool
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r .github/requirements-build.txt
      - name: Build wheel
        run: python -m build --no-isolation --wheel --outdir dist src/ai-gateway
      - name: Run unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install dist/*.whl
          python -m pytest src/ai-gateway/azext_ai_gateway/tests/unittests
      - name: Install and load with Azure CLI
        env:
          AZURE_EXTENSION_DIR: ${{ runner.temp }}/azure-cli-extensions
        run: |
          az extension add --source dist/*.whl --yes
          az extension show --name ai-gateway --query name --output tsv
          az ai-gateway version --output json
