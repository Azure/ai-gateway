<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="title desc" data-name="github-copilot-byok">
<title id="title">GitHub Copilot with models and tools from Azure AI Gateway</title>
<desc id="desc">The GitHub Copilot app, Copilot CLI, Copilot SDK, and Copilot in VS Code each add the gateway as a bring-your-own-key model provider and the gateway learn MCP server as a tool server. They call the gpt-6-astra alias on the gateway OpenAI v1 endpoint with the Responses API, and the learn MCP endpoint, both with the github-copilot API key: as a bearer token for models and in the api-key header for MCP. The gateway applies a per-caller token limit, records usage for Monitoring, calls the gpt-6-astra deployment in Microsoft Foundry with its managed identity, and calls the public Microsoft Learn MCP server.</desc>
