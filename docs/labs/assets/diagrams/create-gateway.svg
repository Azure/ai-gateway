<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" role="img" aria-labelledby="title desc" data-name="create-gateway">
<title id="title">What to choose in Create AI gateway</title>
<desc id="desc">Basics: a globally unique name of 24 characters or fewer, a subscription where you can create API Management and connector gateways, a new or existing resource group, and a region where AI Gateway is available. Advanced: keep the system-assigned managed identity enabled, public network access enabled, and public routing. Private routing is for virtual network backends and can only be chosen at creation. Then select Create gateway; provisioning takes a few minutes and Home opens with a setup guide.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="424"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="456" height="304" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="54" y="43" class="dg-cap">BASICS</text></g><text x="36" y="74" class="dg-t">Name</text><g class="tn-azure"><rect class="dg-pill" x="36" y="84" width="84" height="22" rx="11"/><text x="78" y="99" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">&lt;gateway&gt;</text></g><text x="132" y="100" class="dg-s">Globally unique, 24 characters or fewer</text><text x="36" y="140" class="dg-t">Subscription</text><text x="36" y="166" class="dg-s">Needs write access to API Management and connector gateways</text><text x="36" y="206" class="dg-t">Resource group</text><g class="tn-azure"><rect class="dg-pill" x="36" y="216" width="40" height="22" rx="11"/><text x="56" y="231" class="dg-pill-t" text-anchor="middle">New</text></g><g class="tn-azure"><rect class="dg-pill" x="82" y="216" width="72" height="22" rx="11"/><text x="118" y="231" class="dg-pill-t" text-anchor="middle">Existing</text></g><text x="166" y="232" class="dg-s">Holds the gateway and its connector</text><text x="36" y="272" class="dg-t">Region</text><text x="36" y="298" class="dg-s">One where AI Gateway is available, as listed by the CLI</text><g class="tn-green"><rect class="dg-zone" x="488" y="20" width="456" height="304" rx="16"/><path class="dg-ic" transform="translate(504 30) scale(0.6667)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="526" y="43" class="dg-cap">ADVANCED · KEEP THE DEFAULTS</text></g><text x="508" y="74" class="dg-t">System-assigned managed identity</text><g class="tn-green"><rect class="dg-pill" x="508" y="84" width="66" height="22" rx="11"/><text x="541" y="99" class="dg-pill-t" text-anchor="middle">Enabled</text></g><text x="586" y="100" class="dg-s">The gateway uses it to call Foundry</text><text x="508" y="140" class="dg-t">Public network access</text><g class="tn-green"><rect class="dg-pill" x="508" y="150" width="66" height="22" rx="11"/><text x="541" y="165" class="dg-pill-t" text-anchor="middle">Enabled</text></g><text x="586" y="166" class="dg-s">Apps reach the runtime URL over HTTPS</text><text x="508" y="206" class="dg-t">Routing</text><g class="tn-green"><rect class="dg-pill" x="508" y="216" width="112" height="22" rx="11"/><text x="564" y="231" class="dg-pill-t" text-anchor="middle">Public routing</text></g><g class="tn-amber"><rect class="dg-pill" x="626" y="216" width="118" height="22" rx="11"/><text x="685" y="231" class="dg-pill-t" text-anchor="middle">Private routing</text></g><text x="756" y="232" class="dg-s">Private: creation only</text><text x="508" y="276" class="dg-s">Private routing reaches backends in a virtual network.</text><text x="508" y="294" class="dg-s">Lab 18 covers it.</text><g class="tn-violet"><rect class="dg-box-tn" x="16" y="348" width="284" height="56" rx="10"/><rect class="dg-chip" x="27" y="359" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(34 366) scale(0.8333)" d="M5 12.5l4.5 4.5L19 7"/><text x="72" y="373" class="dg-t">Create gateway</text><text x="72" y="390" class="dg-s">Select it to start</text></g><g class="tn-azure"><rect class="dg-box" x="338" y="348" width="284" height="56" rx="10"/><rect class="dg-chip" x="349" y="359" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(356 366) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2"/><text x="394" y="373" class="dg-t">Provisioning</text><text x="394" y="390" class="dg-s">A few minutes, often less</text></g><g class="tn-green"><rect class="dg-box" x="660" y="348" width="284" height="56" rx="10"/><rect class="dg-chip" x="671" y="359" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(678 366) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="716" y="373" class="dg-t">Home</text><text x="716" y="390" class="dg-s">Opens with a setup guide</text></g><g class="tn-violet"><path class="dg-line" d="M300 376 H334" marker-end="url(#ah)"/><path class="dg-flow" d="M300 376 H334"/></g><g class="tn-azure"><path class="dg-line" d="M622 376 H656" marker-end="url(#ah)"/><path class="dg-flow" d="M622 376 H656"/></g>
</g></svg>
