<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" data-name="streaming-usage">
<title id="title">Streamed responses through Azure AI Gateway</title>
<desc id="desc">A client sends stream: true. The gateway checks token, cost and request limits before the stream starts and returns a JSON 429 when a limit is full. It then relays server-sent event chunks from the model as they arrive and captures token usage for counters, cost limits and Monitoring, whether or not the client set include_usage. A Chat Completions stream carries a prompt filter chunk, a role chunk, content deltas, a finish chunk, a usage chunk when include_usage is set, and [DONE].</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="440"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="200" height="290" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="70" width="176" height="60" rx="10"/><rect class="dg-chip" x="39" y="83" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 90) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="97" class="dg-t">Your app</text><text x="84" y="114" class="dg-m">stream: true</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="190" width="176" height="60" rx="10"/><rect class="dg-chip" x="39" y="203" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 210) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="84" y="217" class="dg-t">Agent</text><text x="84" y="234" class="dg-s">Responses API</text></g><circle class="dg-dot tn-azure" cx="32" cy="276" r="3.5"/><text x="42" y="280" class="dg-s">Reads data: lines</text><circle class="dg-dot tn-azure" cx="32" cy="298" r="3.5"/><text x="42" y="302" class="dg-s">Stops at [DONE]</text><g class="tn-violet"><rect class="dg-gw" x="252" y="20" width="400" height="290" rx="16"/><path class="dg-ic" transform="translate(268 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="290" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="268" y="54" width="368" height="62" rx="10"/><rect class="dg-chip" x="279" y="68" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 75) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="324" y="74" class="dg-t">Check limits before the stream</text><text x="324" y="91" class="dg-s">Token limit, cost limit, request rate</text><text x="324" y="107" class="dg-s">Full: a JSON 429, no stream starts</text></g><g class="tn-azure"><rect class="dg-box" x="268" y="126" width="368" height="62" rx="10"/><rect class="dg-chip" x="279" y="140" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 147) scale(0.8333)" d="M13 3 5 14h6l-1 7 8-11h-6z"/><text x="324" y="154" class="dg-t">Relay chunks as they arrive</text><text x="324" y="171" class="dg-s">text/event-stream, no buffering</text></g><g class="tn-green"><rect class="dg-box-tn" x="268" y="198" width="368" height="62" rx="10"/><rect class="dg-chip" x="279" y="212" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 219) scale(0.8333)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="324" y="218" class="dg-t">Capture usage from every stream</text><text x="324" y="235" class="dg-s">Prompt and completion tokens,</text><text x="324" y="251" class="dg-s">with or without include_usage</text></g><g class="tn-green"><rect class="dg-pill" x="268" y="274" width="112" height="22" rx="11"/><text x="324" y="289" class="dg-pill-t" text-anchor="middle">Token counters</text></g><g class="tn-green"><rect class="dg-pill" x="386" y="274" width="92" height="22" rx="11"/><text x="432" y="289" class="dg-pill-t" text-anchor="middle">Cost limits</text></g><g class="tn-green"><rect class="dg-pill" x="484" y="274" width="86" height="22" rx="11"/><text x="527" y="289" class="dg-pill-t" text-anchor="middle">Monitoring</text></g><g class="tn-azure"><rect class="dg-zone" x="688" y="20" width="256" height="290" rx="16"/><path class="dg-ic" transform="translate(704 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="726" y="43" class="dg-cap">MODEL</text></g><g class="tn-violet"><rect class="dg-box" x="700" y="120" width="232" height="76" rx="10"/><rect class="dg-chip" x="711" y="141" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(718 148) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="756" y="147" class="dg-t">Foundry model</text><text x="756" y="164" class="dg-s">gpt-6-luna</text><text x="756" y="180" class="dg-s">Streams tokens as made</text></g><circle class="dg-dot tn-violet" cx="704" cy="228" r="3.5"/><text x="714" y="232" class="dg-s">Tokens as data: chunks</text><circle class="dg-dot tn-violet" cx="704" cy="250" r="3.5"/><text x="714" y="254" class="dg-s">Usage in the final chunk</text><circle class="dg-dot tn-violet" cx="704" cy="272" r="3.5"/><text x="714" y="276" class="dg-s">Responses: response.completed</text><g class="tn-azure"><path class="dg-line" d="M206 96 C236 96 236 80 264 80" marker-end="url(#ah)"/><path class="dg-flow" d="M206 96 C236 96 236 80 264 80"/></g><g class="tn-azure"><path class="dg-line" d="M206 216 C240 216 236 90 264 90" marker-end="url(#ah)"/><path class="dg-flow" d="M206 216 C240 216 236 90 264 90"/></g><g class="tn-violet"><path class="dg-line" d="M638 85 C668 85 668 140 696 140" marker-end="url(#ah)"/><path class="dg-flow" d="M638 85 C668 85 668 140 696 140"/></g><g class="tn-green"><path class="dg-line" d="M698 176 C668 176 668 157 640 157" marker-end="url(#ah)"/><path class="dg-flow" d="M698 176 C668 176 668 157 640 157"/></g><g class="tn-green"><path class="dg-line" d="M266 152 C238 152 236 112 208 112" marker-end="url(#ah)"/><path class="dg-flow" d="M266 152 C238 152 236 112 208 112"/></g><g class="tn-green"><path class="dg-line" d="M266 162 C238 162 236 232 208 232" marker-end="url(#ah)"/><path class="dg-flow" d="M266 162 C238 162 236 232 208 232"/></g><text x="32" y="340" class="dg-cap">WHAT A CHAT COMPLETIONS STREAM CARRIES, IN ORDER</text><g class="tn-amber"><rect class="dg-pill" x="32" y="352" width="113" height="22" rx="11"/><text x="88.5" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">prompt filter</text></g><text x="88.5" y="394" class="dg-s" text-anchor="middle">empty choices</text><g class="tn-azure"><rect class="dg-pill" x="155" y="352" width="49" height="22" rx="11"/><text x="179.5" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">role</text></g><g class="tn-violet"><rect class="dg-pill" x="214" y="352" width="56" height="22" rx="11"/><text x="242" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">delta</text></g><g class="tn-violet"><rect class="dg-pill" x="280" y="352" width="56" height="22" rx="11"/><text x="308" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">delta</text></g><g class="tn-violet"><rect class="dg-pill" x="346" y="352" width="27" height="22" rx="11"/><text x="359.5" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">…</text></g><g class="tn-violet"><rect class="dg-pill" x="383" y="352" width="155" height="22" rx="11"/><text x="460.5" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">finish_reason: stop</text></g><g class="tn-green"><rect class="dg-pill" x="548" y="352" width="56" height="22" rx="11"/><text x="576" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">usage</text></g><text x="576" y="394" class="dg-s" text-anchor="middle">empty choices, only with include_usage</text><g class="tn-azure"><rect class="dg-pill" x="614" y="352" width="63" height="22" rx="11"/><text x="645.5" y="367" class="dg-pill-t" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">[DONE]</text></g><text x="32" y="428" class="dg-s">The gateway counts every stream. Limits apply to the next request: a stream that started finishes.</text>
</g></svg>
