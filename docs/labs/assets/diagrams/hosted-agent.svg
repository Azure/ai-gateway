 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="334" y="171" class="dg-t">Hosted agent</text><text x="334" y="188" class="dg-s">Agent Framework</text><text x="334" y="204" class="dg-s">Python</text></g><g class="tn-azure"><path class="dg-dash" d="M226 92 C252 92 252 160 274 160" marker-end="url(#ah)"/></g><g class="tn-azure"><path class="dg-line" d="M226 186 H274" marker-end="url(#ah)"/><path class="dg-flow" d="M226 186 H274"/></g><g class="tn-azure"><path class="dg-line" d="M226 280 C252 280 252 210 274 210" marker-end="url(#ah)"/><path class="dg-flow" d="M226 280 C252 280 252 210 274 210"/></g><g class="tn-violet"><rect class="dg-gw" x="496" y="20" width="240" height="340" rx="16"/><path class="dg-ic" transform="translate(512 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="534" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="510" y="70" width="212" height="72" rx="10"/><rect class="dg-chip" x="521" y="89" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(528 96) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="566" y="103" class="dg-t">Model alias</text><text x="566" y="120" class="dg-s">Bearer: runtime key</text></g><g class="tn-amber"><rect class="dg-box-tn" x="510" y="166" width="212" height="72" rx="10"/><rect class="dg-chip" x="521" y="185" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(528 192) scale(0.8333)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="566" y="199" class="dg-t">MCP server: learn</text><text x="566" y="216" class="dg-s">api-key header</text></g><g class="tn-magenta"><rect class="dg-pill" x="510" y="262" width="125" height="22" rx="11"/><text x="572.5" y="277" class="dg-pill-t" text-anchor="middle">hosted-agent key</text></g><g class="tn-magenta"><rect class="dg-pill" x="510" y="290" width="99" height="22" rx="11"/><text x="559.5" y="305" class="dg-pill-t" text-anchor="middle">Token limits</text></g><g class="tn-magenta"><rect class="dg-pill" x="615" y="290" width="86" height="22" rx="11"/><text x="658" y="305" class="dg-pill-t" text-anchor="middle">Monitoring</text></g><g class="tn-violet"><path class="dg-line" d="M456 170 C484 170 480 106 506 106" marker-end="url(#ah)"/><path class="dg-flow" d="M456 170 C484 170 480 106 506 106"/></g><g class="tn-amber"><path class="dg-line" d="M456 194 C484 194 480 202 506 202" marker-end="url(#ah)"/><path class="dg-flow" d="M456 194 C484 194 480 202 506 202"/></g><g class="tn-azure"><rect class="dg-zone" x="766" y="20" width="178" height="340" rx="16"/><path class="dg-ic" transform="translate(782 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="804" y="43" class="dg-cap">BACKENDS</text></g><g class="tn-azure"><rect class="dg-box" x="778" y="70" width="154" height="72" rx="10"/><rect class="dg-chip" x="789" y="89" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(796 96) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="834" y="103" class="dg-t">Foundry</text><text x="834" y="120" class="dg-s">models</text></g><g class="tn-amber"><rect class="dg-box" x="778" y="166" width="154" height="72" rx="10"/><rect class="dg-chip" x="789" y="185" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(796 192) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="834" y="199" class="dg-t">Learn MCP</text><text x="834" y="216" class="dg-s">Public server</text></g><g class="tn-azure"><path class="dg-line" d="M724 106 H774" marker-end="url(#ah)"/><path class="dg-flow" d="M724 106 H774"/></g><g class="tn-amber"><path class="dg-line" d="M724 202 H774" marker-end="url(#ah)"/><path class="dg-flow" d="M724 202 H774"/></g><text x="16" y="388" class="dg-s">The agent reaches models and tools only through the gateway, with its own key, so its limits and telemetry stay separate.</text>
</g></svg>
