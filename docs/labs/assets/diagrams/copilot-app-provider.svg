<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" data-name="copilot-app-provider">
<title id="title">Add AI Gateway as a model provider in the GitHub Copilot app</title>
<desc id="desc">An illustration, not a screenshot. Open app settings and select Model providers, then Add provider. Choose Any OpenAI-compatible HTTP endpoint, enter a display name, the gateway base URL ending in /default/models/openai/v1, and the github-copilot API key. Choose the Responses wire API if the form offers it, add gpt-6-astra as a model by hand because the gateway does not list models, then pick gpt-6-astra in the model picker.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="470"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="16" width="928" height="108" rx="16"/><path class="dg-ic" transform="translate(32 26) scale(0.6667)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="54" y="39" class="dg-cap">IN THE GITHUB COPILOT APP</text></g><g class="tn-azure"><rect class="dg-box" x="32" y="46" width="203" height="62" rx="10"/><rect class="dg-chip" x="43" y="60" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(50 67) scale(0.8333)" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/><text x="88" y="74" class="dg-t">App settings</text><text x="88" y="91" class="dg-s">Model providers</text></g><g class="tn-azure"><rect class="dg-box" x="263" y="46" width="203" height="62" rx="10"/><rect class="dg-chip" x="274" y="60" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(281 67) scale(0.8333)" d="M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/><text x="319" y="74" class="dg-t">Add provider</text><text x="319" y="91" class="dg-s">OpenAI-compatible</text></g><g class="tn-azure"><rect class="dg-box-tn" x="494" y="46" width="203" height="62" rx="10"/><rect class="dg-chip" x="505" y="60" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(512 67) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="550" y="74" class="dg-t">Provider details</text><text x="550" y="91" class="dg-s">Base URL and API key</text></g><g class="tn-azure"><rect class="dg-box" x="725" y="46" width="203" height="62" rx="10"/><rect class="dg-chip" x="736" y="60" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(743 67) scale(0.8333)" d="M5 12.5l4.5 4.5L19 7"/><text x="781" y="74" class="dg-t">Pick the model</text><text x="781" y="91" class="dg-m">gpt-6-astra</text></g><g class="tn-azure"><path class="dg-line" d="M235 77 H259" marker-end="url(#ah)"/><path class="dg-flow" d="M235 77 H259"/></g><g class="tn-azure"><path class="dg-line" d="M466 77 H490" marker-end="url(#ah)"/><path class="dg-flow" d="M466 77 H490"/></g><g class="tn-azure"><path class="dg-line" d="M697 77 H721" marker-end="url(#ah)"/><path class="dg-flow" d="M697 77 H721"/></g><g class="tn-violet"><rect class="dg-gw" x="16" y="146" width="928" height="284" rx="16"/><path class="dg-ic" transform="translate(32 156) scale(0.6667)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="54" y="169" class="dg-cap-tn">PROVIDER DETAILS · ILLUSTRATION, NOT A SCREENSHOT</text></g><text x="40" y="196" class="dg-t" style="font-size:13px">Provider</text><rect class="dg-bar" x="176" y="177" width="744" height="28" rx="6"/><text x="188" y="196" class="dg-s" style="fill:var(--dg-text)">Any OpenAI-compatible HTTP endpoint</text><text x="40" y="234" class="dg-t" style="font-size:13px">Display name</text><rect class="dg-bar" x="176" y="215" width="744" height="28" rx="6"/><text x="188" y="234" class="dg-s" style="fill:var(--dg-text)">AI Gateway</text><text x="40" y="272" class="dg-t" style="font-size:13px">Base URL</text><rect class="dg-bar" x="176" y="253" width="744" height="28" rx="6"/><text x="188" y="272" class="dg-m">https://&lt;gateway-host&gt;/default/models/openai/v1</text><text x="40" y="310" class="dg-t" style="font-size:13px">API key</text><rect class="dg-bar" x="176" y="291" width="744" height="28" rx="6"/><text x="188" y="310" class="dg-s" style="fill:var(--dg-text)">••••••••••••••••  the github-copilot key, kept in the system credential store</text><text x="40" y="348" class="dg-t" style="font-size:13px">Wire API</text><rect class="dg-bar" x="176" y="329" width="744" height="28" rx="6"/><text x="188" y="348" class="dg-s" style="fill:var(--dg-text)">Responses, if the form offers it</text><text x="40" y="386" class="dg-t" style="font-size:13px">Model</text><rect class="dg-bar" x="176" y="367" width="744" height="28" rx="6"/><text x="188" y="386" class="dg-s" style="fill:var(--dg-text)">gpt-6-astra, added by hand: the gateway has no /models list</text><text x="16" y="458" class="dg-s">Field names vary by app version. The app stores the key in the system credential store and never shows it again.</text>
</g></svg>
