<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" data-name="observability">
<title id="title">Observability with OpenTelemetry</title>
<desc id="desc">The gateway emits OpenTelemetry metrics, logs and traces for model calls, tool calls and policy decisions. Signals go to Application Insights, which powers the built-in Monitoring dashboard, or to any OTLP endpoint.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="420"/>
<g class="tn-violet"><rect class="dg-gw" x="16" y="20" width="290" height="340" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="54" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="56" width="266" height="72" rx="10"/><rect class="dg-chip" x="39" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 82) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="84" y="89" class="dg-t">Model calls</text><text x="84" y="106" class="dg-s">Tokens, latency, estimated cost</text></g><g class="tn-green"><path class="dg-line" d="M296 92 C326 92 326 88 358 88" marker-end="url(#ah)"/><path class="dg-flow" d="M296 92 C326 92 326 88 358 88"/></g><g class="tn-amber"><rect class="dg-box" x="28" y="152" width="266" height="72" rx="10"/><rect class="dg-chip" x="39" y="171" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 178) scale(0.8333)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="84" y="185" class="dg-t">Tool calls</text><text x="84" y="202" class="dg-s">tools/list and tools/call</text></g><g class="tn-green"><path class="dg-line" d="M296 188 C326 188 326 184 358 184" marker-end="url(#ah)"/><path class="dg-flow" d="M296 188 C326 188 326 184 358 184"/></g><g class="tn-magenta"><rect class="dg-box" x="28" y="248" width="266" height="72" rx="10"/><rect class="dg-chip" x="39" y="267" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 274) scale(0.8333)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="84" y="281" class="dg-t">Policy decisions</text><text x="84" y="298" class="dg-s">Allowed, blocked, and why</text></g><g class="tn-green"><path class="dg-line" d="M296 284 C326 284 326 280 358 280" marker-end="url(#ah)"/><path class="dg-flow" d="M296 284 C326 284 326 280 358 280"/></g><g class="tn-green"><rect class="dg-zone" x="346" y="20" width="250" height="340" rx="16"/><path class="dg-ic" transform="translate(362 30) scale(0.6667)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="384" y="43" class="dg-cap">OPENTELEMETRY (OTLP)</text></g><g class="tn-green"><rect class="dg-box-tn" x="362" y="56" width="218" height="72" rx="10"/><rect class="dg-chip" x="373" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(380 82) scale(0.8333)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="418" y="89" class="dg-t">Metrics</text><text x="418" y="106" class="dg-s">Token usage and cost</text></g><g class="tn-green"><rect class="dg-box-tn" x="362" y="152" width="218" height="72" rx="10"/><rect class="dg-chip" x="373" y="171" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(380 178) scale(0.8333)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="418" y="185" class="dg-t">Logs</text><text x="418" y="202" class="dg-s">Requests and outcomes</text></g><g class="tn-green"><rect class="dg-box-tn" x="362" y="248" width="218" height="72" rx="10"/><rect class="dg-chip" x="373" y="267" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(380 274) scale(0.8333)" d="M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 16.5l9 5 9-5"/><text x="418" y="281" class="dg-t">Traces</text><text x="418" y="298" class="dg-s">Policy spans per request</text></g><g class="tn-green"><path class="dg-line" d="M582 92 C614 92 614 98 646 98" marker-end="url(#ah)"/><path class="dg-flow" d="M582 92 C614 92 614 98 646 98"/></g><g class="tn-green"><path class="dg-line" d="M582 188 C614 188 614 98 646 98" marker-end="url(#ah)"/><path class="dg-flow" d="M582 188 C614 188 614 98 646 98"/></g><g class="tn-green"><path class="dg-line" d="M582 284 C614 284 614 98 646 98" marker-end="url(#ah)"/><path class="dg-flow" d="M582 284 C614 284 614 98 646 98"/></g><g class="tn-green"><path class="dg-line" d="M582 284 C614 284 614 300 646 300" marker-end="url(#ah)"/><path class="dg-flow" d="M582 284 C614 284 614 300 646 300"/></g><g class="tn-azure"><rect class="dg-zone" x="636" y="20" width="308" height="340" rx="16"/><path class="dg-ic" transform="translate(652 30) scale(0.6667)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="674" y="43" class="dg-cap">DESTINATIONS</text></g><g class="tn-azure"><rect class="dg-box-tn" x="652" y="56" width="276" height="84" rx="10"/><rect class="dg-chip" x="663" y="81" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(670 88) scale(0.8333)" d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/><text x="708" y="87" class="dg-t">Application Insights</text><text x="708" y="104" class="dg-s">Powers the built-in</text><text x="708" y="120" class="dg-s">Monitoring dashboard</text></g><text x="656" y="166" class="dg-cap">DASHBOARD TABS</text><g class="tn-azure"><rect class="dg-pill" x="652" y="176" width="72" height="22" rx="11"/><text x="688" y="191" class="dg-pill-t" text-anchor="middle">Overview</text></g><g class="tn-azure"><rect class="dg-pill" x="730" y="176" width="59" height="22" rx="11"/><text x="759.5" y="191" class="dg-pill-t" text-anchor="middle">Models</text></g><g class="tn-azure"><rect class="dg-pill" x="795" y="176" width="53" height="22" rx="11"/><text x="821.5" y="191" class="dg-pill-t" text-anchor="middle">Tools</text></g><g class="tn-azure"><rect class="dg-pill" x="854" y="176" width="72" height="22" rx="11"/><text x="890" y="191" class="dg-pill-t" text-anchor="middle">Policies</text></g><g class="tn-azure"><rect class="dg-pill" x="652" y="204" width="59" height="22" rx="11"/><text x="681.5" y="219" class="dg-pill-t" text-anchor="middle">Traces</text></g><g class="tn-azure"><rect class="dg-box" x="652" y="268" width="276" height="64" rx="10"/><rect class="dg-chip" x="663" y="283" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(670 290) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="708" y="297" class="dg-t">Any OTLP endpoint</text><text x="708" y="314" class="dg-s">Your observability backend</text></g><text x="16" y="386" class="dg-s">Token metric</text><text x="100" y="386" class="dg-m">gen_ai_client_token_usage</text><text x="16" y="408" class="dg-s">Claim attribute</text><text x="116" y="408" class="dg-m">azure.ai_gateway.identity.claims.&lt;claim&gt;</text>
</g></svg>
