<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc" data-name="agent-365">
<title id="title">Govern MCP servers with Microsoft Agent 365</title>
<desc id="desc">The Microsoft 365 admin center inventories API Management gateways and MCP servers. Admins block or unblock MCP servers, and block individual tools when the server has a static allow list. The gateway enforces the decisions for agents and sends runtime signals back for audit.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="400"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="290" height="340" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M5 7.5 12 4l7 3.5v9L12 20l-7-3.5z M12 4v16 M5 7.5l7 4 7-4"/><text x="54" y="43" class="dg-cap">MICROSOFT 365 ADMIN CENTER</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="56" width="266" height="72" rx="10"/><rect class="dg-chip" x="39" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 82) scale(0.8333)" d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/><text x="84" y="81" class="dg-t">Inventory</text><text x="84" y="98" class="dg-s">API Management gateways</text><text x="84" y="114" class="dg-s">and MCP servers</text></g><g class="tn-red"><rect class="dg-box-tn" x="28" y="148" width="266" height="72" rx="10"/><rect class="dg-chip" x="39" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 174) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M5.6 5.6l12.8 12.8"/><text x="84" y="181" class="dg-t">Block or unblock</text><text x="84" y="198" class="dg-s">Whole MCP servers</text></g><g class="tn-red"><rect class="dg-box" x="28" y="240" width="266" height="84" rx="10"/><rect class="dg-chip" x="39" y="265" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 272) scale(0.8333)" d="M4 5h16l-6 7.5V18l-4 2v-7.5z"/><text x="84" y="271" class="dg-t">Block individual tools</text><text x="84" y="288" class="dg-s">Requires a static allow list</text><text x="84" y="304" class="dg-s">on the MCP server</text></g><g class="tn-violet"><rect class="dg-gw" x="350" y="20" width="290" height="340" rx="16"/><path class="dg-ic" transform="translate(366 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="388" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-amber"><rect class="dg-box-tn" x="366" y="56" width="258" height="72" rx="10"/><rect class="dg-chip" x="377" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(384 82) scale(0.8333)" d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.7 2.7-3-3z"/><text x="422" y="89" class="dg-t">MCP server: github-tools</text><text x="422" y="106" class="dg-s">Allowed tools only</text></g><g class="tn-red"><rect class="dg-box" x="366" y="148" width="258" height="72" rx="10"/><rect class="dg-chip" x="377" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(384 174) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M5.6 5.6l12.8 12.8"/><text x="422" y="181" class="dg-t">MCP server: crm-tools</text><text x="422" y="198" class="dg-s">Blocked by admin</text></g><g class="tn-magenta"><rect class="dg-box" x="366" y="240" width="258" height="84" rx="10"/><rect class="dg-chip" x="377" y="265" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(384 272) scale(0.8333)" d="M12 3l7.5 3v6c0 4.6-3.2 7.9-7.5 9-4.3-1.1-7.5-4.4-7.5-9V6z M9 12l2 2 4-4"/><text x="422" y="271" class="dg-t">Tool threat protection</text><text x="422" y="288" class="dg-s">Defender and Purview</text><text x="422" y="304" class="dg-s">before and after tool calls</text></g><g class="tn-red"><path class="dg-line" d="M296 184 H362" marker-end="url(#ah)"/><path class="dg-flow" d="M296 184 H362"/></g><g class="tn-red"><path class="dg-line" d="M296 282 C330 282 330 92 362 92" marker-end="url(#ah)"/><path class="dg-flow" d="M296 282 C330 282 330 92 362 92"/></g><g class="tn-green"><path class="dg-dash" d="M366 312 C336 312 330 342 296 342" marker-end="url(#ah)"/></g><rect x="122" y="333" width="168" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="206" y="346" class="dg-s" text-anchor="middle">Runtime signals for audit</text><g class="tn-cyan"><rect class="dg-zone" x="684" y="20" width="260" height="340" rx="16"/><path class="dg-ic" transform="translate(700 30) scale(0.6667)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="722" y="43" class="dg-cap">AGENTS</text></g><g class="tn-cyan"><rect class="dg-box" x="696" y="56" width="236" height="72" rx="10"/><rect class="dg-chip" x="707" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(714 82) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="752" y="89" class="dg-t">Copilot agents</text><text x="752" y="106" class="dg-s">Built in Microsoft 365</text></g><g class="tn-cyan"><path class="dg-line" d="M694 92 C664 92 664 92 628 92" marker-end="url(#ah)"/><path class="dg-flow" d="M694 92 C664 92 664 92 628 92"/></g><g class="tn-cyan"><rect class="dg-box" x="696" y="148" width="236" height="72" rx="10"/><rect class="dg-chip" x="707" y="167" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(714 174) scale(0.8333)" d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 9.6 4.5 4.5 0 0 0 7 18.5z"/><text x="752" y="181" class="dg-t">Hosted agents</text><text x="752" y="198" class="dg-s">Microsoft Foundry</text></g><g class="tn-cyan"><path class="dg-line" d="M694 184 C664 184 664 184 628 184" marker-end="url(#ah)"/><path class="dg-flow" d="M694 184 C664 184 664 184 628 184"/></g><g class="tn-cyan"><rect class="dg-box" x="696" y="240" width="236" height="72" rx="10"/><rect class="dg-chip" x="707" y="259" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(714 266) scale(0.8333)" d="M3.5 5h17v14h-17z M7 10l3 2-3 2 M12.5 15h4.5"/><text x="752" y="273" class="dg-t">Coding agents</text><text x="752" y="290" class="dg-s">IDEs and CLIs</text></g><g class="tn-cyan"><path class="dg-line" d="M694 276 C664 276 664 184 628 184" marker-end="url(#ah)"/><path class="dg-flow" d="M694 276 C664 276 664 184 628 184"/></g><text x="16" y="388" class="dg-s">Decisions made by Microsoft 365 admins are enforced by the gateway on every tool call.</text>
</g></svg>
