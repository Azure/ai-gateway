<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" data-name="alias-routing">
<title id="title">Priority and weighted routing behind one alias</title>
<desc id="desc">Clients keep calling the alias chat. The alias lists several backend models, each with a priority and a weight. The gateway picks the lowest priority number, then splits traffic among the backend models at that priority in proportion to their weights: gpt-6-luna with weight 80 gets 80 percent and the gpt-6.1-sol canary with weight 20 gets 20 percent. A backend model at priority 1 is a lower preference.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="420"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="200" height="360" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="96" width="176" height="60" rx="10"/><rect class="dg-chip" x="39" y="109" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 116) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="123" class="dg-t">Chat app</text><text x="84" y="140" class="dg-m">model: chat</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="236" width="176" height="60" rx="10"/><rect class="dg-chip" x="39" y="249" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 256) scale(0.8333)" d="M6 9h12v10H6z M12 9V6 M12 4.5v.01 M9.5 13.5v.01 M14.5 13.5v.01 M10 16.5h4 M4 13v2 M20 13v2"/><text x="84" y="263" class="dg-t">Support agent</text><text x="84" y="280" class="dg-m">model: chat</text></g><g class="tn-violet"><rect class="dg-gw" x="252" y="20" width="312" height="360" rx="16"/><path class="dg-ic" transform="translate(268 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="290" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="268" y="60" width="280" height="64" rx="10"/><rect class="dg-chip" x="279" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(286 82) scale(0.8333)" d="M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M8 18h5a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3 M16.5 3.5 19 6l-2.5 2.5"/><text x="324" y="81" class="dg-t">Alias: chat</text><text x="324" y="98" class="dg-s">Lowest priority first,</text><text x="324" y="114" class="dg-s">then split by weight</text></g><text x="272" y="162" class="dg-cap">SHARE WITHIN PRIORITY 0</text><text x="272" y="190" class="dg-m">gpt-6-luna</text><g class="tn-violet"><rect class="dg-bar" x="272" y="198" width="214" height="10" rx="5"/><rect class="dg-bar-fill" x="272" y="198" width="171" height="10" rx="5"/></g><text x="548" y="208" class="dg-t" text-anchor="end">80%</text><text x="272" y="240" class="dg-m">gpt-6.1-sol</text><g class="tn-magenta"><rect class="dg-bar" x="272" y="248" width="214" height="10" rx="5"/><rect class="dg-bar-fill" x="272" y="248" width="43" height="10" rx="5"/></g><text x="548" y="258" class="dg-t" text-anchor="end">20%</text><text x="272" y="300" class="dg-s">share = weight ÷ sum of the weights</text><text x="272" y="318" class="dg-s">at the same priority</text><text x="272" y="346" class="dg-m">80 ÷ (80 + 20) = 80%</text><g class="tn-azure"><rect class="dg-zone" x="600" y="20" width="344" height="360" rx="16"/><path class="dg-ic" transform="translate(616 30) scale(0.6667)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="638" y="43" class="dg-cap">BACKEND MODELS</text></g><g class="tn-violet"><rect class="dg-zone" x="612" y="52" width="320" height="196" rx="16"/><text x="628" y="75" class="dg-cap">PRIORITY 0 · PREFERRED</text></g><g class="tn-violet"><rect class="dg-box-tn" x="624" y="88" width="296" height="64" rx="10"/><rect class="dg-chip" x="635" y="103" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(642 110) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="680" y="117" class="dg-t">gpt-6-luna</text><text x="680" y="134" class="dg-s">Weight 80 · 80% of requests</text></g><g class="tn-magenta"><rect class="dg-box-tn" x="624" y="166" width="296" height="64" rx="10"/><rect class="dg-chip" x="635" y="181" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(642 188) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="680" y="195" class="dg-t">gpt-6.1-sol</text><text x="680" y="212" class="dg-s">Weight 20 · 20% (canary)</text></g><g class="tn-azure"><rect class="dg-zone" x="612" y="262" width="320" height="106" rx="16"/><text x="628" y="285" class="dg-cap">PRIORITY 1 · LOWER PREFERENCE</text></g><g class="tn-azure"><rect class="dg-box" x="624" y="296" width="296" height="60" rx="10"/><rect class="dg-chip" x="635" y="309" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(642 316) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="680" y="323" class="dg-t">gpt-6-sol</text><text x="680" y="340" class="dg-s">Azure OpenAI · weight 1</text></g><g class="tn-azure"><path class="dg-line" d="M206 126 C232 126 240 92 264 92" marker-end="url(#ah)"/><path class="dg-flow" d="M206 126 C232 126 240 92 264 92"/></g><g class="tn-azure"><path class="dg-line" d="M206 266 C240 266 236 100 264 100" marker-end="url(#ah)"/><path class="dg-flow" d="M206 266 C240 266 236 100 264 100"/></g><g class="tn-violet"><path class="dg-line" d="M550 88 C582 88 592 120 620 120" marker-end="url(#ah)"/><path class="dg-flow" d="M550 88 C582 88 592 120 620 120"/></g><g class="tn-magenta"><path class="dg-line" d="M550 98 C586 98 590 198 620 198" marker-end="url(#ah)"/><path class="dg-flow" d="M550 98 C586 98 590 198 620 198"/></g><g class="tn-azure"><path class="dg-dash" d="M550 108 C580 120 596 326 620 326" marker-end="url(#ah)"/></g><text x="16" y="404" class="dg-s">Clients never change: they send model: chat. Change priorities and weights on the alias to shift traffic.</text>
</g></svg>
