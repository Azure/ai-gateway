<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc" data-name="private-networking">
<title id="title">Private networking for Azure AI Gateway</title>
<desc id="desc">Clients reach the gateway on its public endpoint, protected by API keys or Microsoft Entra ID and an IP filter policy. Inbound private endpoints and disabling public network access are not available for the aigateways resource yet. Outbound, private routing chosen when you create the gateway joins it to an integration subnet of at least /27 delegated to Microsoft.Web/serverFarms, so it reaches a Foundry account with public access disabled through a private endpoint and private DNS zones.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="430"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="230" height="330" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CLIENTS</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="56" width="206" height="72" rx="10"/><rect class="dg-chip" x="39" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 82) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="89" class="dg-t">App or agent</text><text x="84" y="106" class="dg-s">Calls the gateway host</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="150" width="206" height="72" rx="10"/><rect class="dg-chip" x="39" y="169" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 176) scale(0.8333)" d="M8 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10.9 13.1 19 5 M16 8l2.5 2.5 M14 10l2 2"/><text x="84" y="183" class="dg-t">Caller credential</text><text x="84" y="200" class="dg-s">API key or Entra token</text></g><path class="dg-ghost" d="M131 130 V148"/><g class="tn-violet"><rect class="dg-gw" x="276" y="20" width="330" height="330" rx="16"/><path class="dg-ic" transform="translate(292 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="314" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="292" y="56" width="298" height="72" rx="10"/><rect class="dg-chip" x="303" y="75" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(310 82) scale(0.8333)" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.7 2.6 2.7 15.4 0 18 M12 3c-2.7 2.6-2.7 15.4 0 18"/><text x="348" y="81" class="dg-t">Inbound</text><text x="348" y="98" class="dg-s">Public endpoint</text><text x="348" y="114" class="dg-m">*.ai.gateway.azure.com</text></g><g class="tn-violet"><rect class="dg-pill" x="292" y="140" width="125" height="22" rx="11"/><text x="354.5" y="155" class="dg-pill-t" text-anchor="middle">Keys or Entra ID</text></g><g class="tn-violet"><rect class="dg-pill" x="423" y="140" width="125" height="22" rx="11"/><text x="485.5" y="155" class="dg-pill-t" text-anchor="middle">IP filter policy</text></g><g class="tn-amber"><rect class="dg-pill" x="292" y="174" width="184" height="22" rx="11"/><text x="384" y="189" class="dg-pill-t" text-anchor="middle">Private frontend: not yet</text></g><g class="tn-green"><rect class="dg-box-tn" x="292" y="252" width="298" height="72" rx="10"/><rect class="dg-chip" x="303" y="271" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(310 278) scale(0.8333)" d="M9 3h6v5H9z M12 8v4 M5 12h14 M5 12v3 M19 12v3 M12 12v3 M3 15h4v5H3z M10 15h4v5h-4z M17 15h4v5h-4z"/><text x="348" y="277" class="dg-t">Outbound</text><text x="348" y="294" class="dg-s">Private routing, set at creation</text><text x="348" y="310" class="dg-m">backend.subnet.id</text></g><g class="tn-azure"><path class="dg-line" d="M236 92 H288" marker-end="url(#ah)"/><path class="dg-flow" d="M236 92 H288"/></g><g class="tn-green"><rect class="dg-zone" x="636" y="20" width="308" height="330" rx="16"/><path class="dg-ic" transform="translate(652 30) scale(0.6667)" d="M9 3h6v5H9z M12 8v4 M5 12h14 M5 12v3 M19 12v3 M12 12v3 M3 15h4v5H3z M10 15h4v5h-4z M17 15h4v5h-4z"/><text x="674" y="43" class="dg-cap">YOUR VIRTUAL NETWORK</text></g><text x="652" y="60" class="dg-s">Integration subnet: /27 or larger,</text><text x="652" y="78" class="dg-m">delegated to Microsoft.Web/serverFarms</text><g class="tn-green"><rect class="dg-box" x="648" y="96" width="284" height="64" rx="10"/><rect class="dg-chip" x="659" y="111" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(666 118) scale(0.8333)" d="M4 5h16v5H4z M4 14h16v5H4z M7 7.5h3 M7 16.5h3 M15 7.5h.01 M15 16.5h.01"/><text x="704" y="125" class="dg-t">Private DNS zones</text><text x="704" y="142" class="dg-m">privatelink.*.azure.com</text></g><path class="dg-ghost" d="M790 162 V180"/><g class="tn-green"><rect class="dg-box-tn" x="648" y="182" width="284" height="64" rx="10"/><rect class="dg-chip" x="659" y="197" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(666 204) scale(0.8333)" d="M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/><text x="704" y="211" class="dg-t">Private endpoint</text><text x="704" y="228" class="dg-m">groupId: account</text></g><g class="tn-green"><path class="dg-line" d="M790 248 V266" marker-end="url(#ah)"/><path class="dg-flow" d="M790 248 V266"/></g><g class="tn-cyan"><rect class="dg-box" x="648" y="268" width="284" height="64" rx="10"/><rect class="dg-chip" x="659" y="283" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(666 290) scale(0.8333)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="704" y="297" class="dg-t">Microsoft Foundry</text><text x="704" y="314" class="dg-s">Public network access disabled</text></g><g class="tn-green"><path class="dg-line" d="M592 288 C620 288 620 214 644 214" marker-end="url(#ah)"/><path class="dg-flow" d="M592 288 C620 288 620 214 644 214"/></g><g class="tn-amber"><path class="dg-ic" transform="translate(16 372) scale(0.8333)" d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3 M12 15v2"/></g><text x="44" y="387" class="dg-s">Inbound private endpoints and turning off public network access aren't available for aigateways yet.</text><g class="tn-amber"><path class="dg-ic" transform="translate(16 400) scale(0.8333)" d="M4 5h16v5H4z M4 14h16v5H4z M7 7.5h3 M7 16.5h3 M15 7.5h.01 M15 16.5h.01"/></g><text x="44" y="415" class="dg-s">DNS is the common pitfall: the gateway must resolve Foundry to its private endpoint IP.</text>
</g></svg>
