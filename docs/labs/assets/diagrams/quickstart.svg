:11px">Foundry User role</text></g><g class="tn-azure"><rect class="dg-box" x="832" y="280" width="56" height="56" rx="14"/><rect class="dg-chip" x="838" y="286" width="44" height="44" rx="10"/><path class="dg-ic" transform="translate(847 295) scale(1.0833)" d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5 12 12l8-4.5 M12 12v9"/><text x="860" y="354" class="dg-t" text-anchor="middle" style="font-size:12.5px">Foundry</text><text x="860" y="370" class="dg-s" text-anchor="middle" style="font-size:11px">gpt-6-luna deployment</text></g><g class="tn-azure"><path class="dg-line" d="M120 308 H244" marker-end="url(#ah)"/><path class="dg-flow" d="M120 308 H244"/></g><g class="tn-violet"><path class="dg-line" d="M306 308 H424" marker-end="url(#ah)"/><path class="dg-flow" d="M306 308 H424"/></g><g class="tn-violet"><path class="dg-line" d="M486 308 H604" marker-end="url(#ah)"/><path class="dg-flow" d="M486 308 H604"/></g><g class="tn-azure"><path class="dg-line" d="M666 308 H828" marker-end="url(#ah)"/><path class="dg-flow" d="M666 308 H828"/></g><rect x="144.8" y="287" width="74.4" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="182" y="300" class="dg-s" text-anchor="middle">POST + key</text><rect x="706.68" y="287" width="80.64" height="18" rx="4" style="fill:var(--dg-bg)"/><text x="747" y="300" class="dg-s" text-anchor="middle">Entra token</text><g class="tn-red"><rect class="dg-pill" x="210.5" y="374" width="131" height="22" rx="11"/><text x="276" y="389" class="dg-pill-t" text-anchor="middle">401 without a key</text></g><g class="tn-green"><rect class="dg-pill" x="801" y="374" width="118" height="22" rx="11"/><text x="860" y="389" class="dg-pill-t" text-anchor="middle">200 · the reply</text></g>
