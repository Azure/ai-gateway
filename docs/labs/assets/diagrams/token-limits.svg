<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc" data-name="token-limits">
<title id="title">Token limits give each caller its own allowance</title>
<desc id="desc">A token limit of 1,000 tokens per minute with the Caller identity counter keeps a separate counter for each caller. App A and the batch job are under the limit and get 200 with a remaining-tokens header. App B exhausted its counter and gets 429 with Retry-After, without the backend being called.</desc>
<defs><style>svg:root{--dg-bg:#fff;--dg-surface:#fff;--dg-surface-2:#f7f7f9;--dg-stroke:#d6d6dc;--dg-text:#242424;--dg-muted:#616161;--dg-violet:#7e5be8;--dg-azure:#0f6cbd;--dg-cyan:#0a9fd8;--dg-magenta:#c2147c;--dg-green:#107c10;--dg-amber:#c46a00;--dg-red:#c50f1f;--dg-gw:#f4f0ff;--dg-gw-stroke:#b9a6f5;--dg-zone:#f6f8fb}@media (prefers-color-scheme:dark){svg:root{--dg-bg:#151518;--dg-surface:#1f1f24;--dg-surface-2:#26262c;--dg-stroke:#3b3b44;--dg-text:#f3f3f5;--dg-muted:#a9a9b2;--dg-violet:#a58bff;--dg-azure:#62abf5;--dg-cyan:#3ccbf4;--dg-magenta:#f472b6;--dg-green:#6cc56c;--dg-amber:#f0a33a;--dg-red:#f1707b;--dg-gw:rgba(142,91,255,.14);--dg-gw-stroke:rgba(165,139,255,.55);--dg-zone:rgba(255,255,255,.03)}}
svg:root>.dg-root>.dg-bg{fill:var(--dg-bg)}
.dg-root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif}
.tn-violet{--tn:var(--dg-violet)}.tn-azure{--tn:var(--dg-azure)}.tn-cyan{--tn:var(--dg-cyan)}.tn-magenta{--tn:var(--dg-magenta)}.tn-green{--tn:var(--dg-green)}.tn-amber{--tn:var(--dg-amber)}.tn-red{--tn:var(--dg-red)}
.dg-bg{fill:none}
.dg-t{fill:var(--dg-text);font-size:14px;font-weight:600}
.dg-s{fill:var(--dg-muted);font-size:12px}
.dg-m{fill:var(--dg-muted);font-family:ui-monospace,'Cascadia Code',SFMono-Regular,Menlo,monospace;font-size:11.5px}
.dg-cap{fill:var(--dg-muted);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-cap-tn{fill:var(--tn);font-size:11px;font-weight:700;letter-spacing:.08em}
.dg-box{fill:var(--dg-surface);stroke:var(--dg-stroke);stroke-width:1.25}
.dg-box-tn{fill:var(--dg-surface);stroke:var(--tn);stroke-width:1.5}
.dg-ghost{fill:none;stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:5 5}
.dg-zone{fill:var(--dg-zone);stroke:var(--dg-stroke);stroke-width:1.25;stroke-dasharray:4 4}
.dg-gw{fill:var(--dg-gw);stroke:var(--dg-gw-stroke);stroke-width:1.5}
.dg-chip{fill:var(--tn);fill-opacity:.13}
.dg-ic{fill:none;stroke:var(--tn);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dg-pill{fill:var(--tn);fill-opacity:.12;stroke:var(--tn);stroke-opacity:.35}
.dg-pill-t{fill:var(--tn);font-size:11.5px;font-weight:600}
.dg-line{fill:none;stroke:var(--dg-stroke);stroke-width:1.75}
.dg-flow{fill:none;stroke:var(--tn);stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;animation:dg-flow 1.4s linear infinite}
.dg-dash{fill:none;stroke:var(--tn);stroke-width:1.75;stroke-dasharray:4 5}
.dg-ah{fill:var(--dg-muted)}
.dg-dot{fill:var(--tn)}
.dg-bar{fill:var(--dg-surface-2);stroke:var(--dg-stroke)}
.dg-bar-fill{fill:var(--tn)}
@keyframes dg-flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.dg-flow{animation:none}}
.dg-paused .dg-flow{animation-play-state:paused}</style><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs>
<g class="dg-root"><rect class="dg-bg" width="960" height="410"/>
<g class="tn-azure"><rect class="dg-zone" x="16" y="20" width="210" height="340" rx="16"/><path class="dg-ic" transform="translate(32 30) scale(0.6667)" d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c1.2-3.3 3.6-5 6.5-5s5.3 1.7 6.5 5 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14.5c1.6.6 2.8 2.4 3.5 5"/><text x="54" y="43" class="dg-cap">CALLERS</text></g><g class="tn-violet"><rect class="dg-gw" x="260" y="20" width="440" height="340" rx="16"/><path class="dg-ic" transform="translate(276 30) scale(0.6667)" d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/><text x="298" y="43" class="dg-cap-tn">AI GATEWAY</text></g><g class="tn-violet"><rect class="dg-box-tn" x="276" y="56" width="408" height="64" rx="10"/><rect class="dg-chip" x="287" y="71" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(294 78) scale(0.8333)" d="M4 17a8 8 0 1 1 16 0 M12 17l3.5-4.5 M7 17h.01 M17 17h.01"/><text x="332" y="85" class="dg-t">Token limit · 1,000 tokens per minute</text><text x="332" y="102" class="dg-s">Counter dimension: Caller identity</text></g><g class="tn-green"><rect class="dg-zone" x="734" y="20" width="210" height="340" rx="16"/><path class="dg-ic" transform="translate(750 30) scale(0.6667)" d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/><text x="772" y="43" class="dg-cap">RESPONSES</text></g><g class="tn-azure"><rect class="dg-box" x="28" y="140" width="186" height="56" rx="10"/><rect class="dg-chip" x="39" y="151" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 158) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="165" class="dg-t">App A</text><text x="84" y="182" class="dg-s">API key</text></g><g class="tn-azure"><path class="dg-line" d="M216 168 H272" marker-end="url(#ah)"/><path class="dg-flow" d="M216 168 H272"/></g><text x="286" y="162" class="dg-t" style="font-size:12.5px">App A counter</text><text x="668" y="162" class="dg-m" text-anchor="end">420 / 1,000</text><g class="tn-green"><rect class="dg-bar" x="286" y="172" width="382" height="10" rx="5"/><rect class="dg-bar-fill" x="286" y="172" width="160.44" height="10" rx="5"/></g><g class="tn-green"><path class="dg-line" d="M690 168 H742" marker-end="url(#ah)"/><path class="dg-flow" d="M690 168 H742"/></g><g class="tn-green"><rect class="dg-pill" x="746" y="144" width="59" height="22" rx="11"/><text x="775.5" y="159" class="dg-pill-t" text-anchor="middle">200 OK</text></g><text x="748" y="186" class="dg-m">remaining-tokens: 580</text><g class="tn-azure"><rect class="dg-box" x="28" y="212" width="186" height="56" rx="10"/><rect class="dg-chip" x="39" y="223" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 230) scale(0.8333)" d="M4 5h16v14H4z M4 9h16 M7 7h.01"/><text x="84" y="237" class="dg-t">App B</text><text x="84" y="254" class="dg-s">API key</text></g><g class="tn-azure"><path class="dg-line" d="M216 240 H272" marker-end="url(#ah)"/><path class="dg-flow" d="M216 240 H272"/></g><text x="286" y="234" class="dg-t" style="font-size:12.5px">App B counter</text><text x="668" y="234" class="dg-m" text-anchor="end">1,000 / 1,000</text><g class="tn-red"><rect class="dg-bar" x="286" y="244" width="382" height="10" rx="5"/><rect class="dg-bar-fill" x="286" y="244" width="382" height="10" rx="5"/></g><g class="tn-red"><path class="dg-line" d="M690 240 H742" marker-end="url(#ah)"/><path class="dg-flow" d="M690 240 H742"/></g><g class="tn-red"><rect class="dg-pill" x="746" y="216" width="99" height="22" rx="11"/><text x="795.5" y="231" class="dg-pill-t" text-anchor="middle">429 Too Many</text></g><text x="748" y="258" class="dg-m">Retry-After: 18</text><g class="tn-azure"><rect class="dg-box" x="28" y="284" width="186" height="56" rx="10"/><rect class="dg-chip" x="39" y="295" width="34" height="34" rx="8"/><path class="dg-ic" transform="translate(46 302) scale(0.8333)" d="M4 4h16v6H4z M4 14h16v6H4z M8 7h.01 M8 17h.01"/><text x="84" y="309" class="dg-t">Batch job</text><text x="84" y="326" class="dg-s">Managed identity</text></g><g class="tn-azure"><path class="dg-line" d="M216 312 H272" marker-end="url(#ah)"/><path class="dg-flow" d="M216 312 H272"/></g><text x="286" y="306" class="dg-t" style="font-size:12.5px">Batch job counter</text><text x="668" y="306" class="dg-m" text-anchor="end">760 / 1,000</text><g class="tn-amber"><rect class="dg-bar" x="286" y="316" width="382" height="10" rx="5"/><rect class="dg-bar-fill" x="286" y="316" width="290.32" height="10" rx="5"/></g><g class="tn-green"><path class="dg-line" d="M690 312 H742" marker-end="url(#ah)"/><path class="dg-flow" d="M690 312 H742"/></g><g class="tn-green"><rect class="dg-pill" x="746" y="288" width="59" height="22" rx="11"/><text x="775.5" y="303" class="dg-pill-t" text-anchor="middle">200 OK</text></g><text x="748" y="330" class="dg-m">remaining-tokens: 240</text><text x="16" y="394" class="dg-s">Each caller is counted separately. The backend is never called for a 429.</text>
</g></svg>
