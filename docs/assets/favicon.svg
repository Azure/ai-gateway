<svg width="240" height="240" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paint0_linear" x1="19.8565" y1="-3.36765" x2="19.8565" y2="66.5036" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3BD5FF"/>
      <stop offset="0.373961" stop-color="#0FAFFF"/>
      <stop offset="0.710605" stop-color="#9C6CFE"/>
      <stop offset="1" stop-color="#BB45EA"/>
    </linearGradient>
    <linearGradient id="paint1_linear" x1="44.1459" y1="6.70627" x2="44.1459" y2="68.1542" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0078D4"/>
      <stop offset="0.323442" stop-color="#0094F0"/>
      <stop offset="0.650788" stop-color="#6864F6"/>
      <stop offset="1" stop-color="#A931D8"/>
    </linearGradient>
    <radialGradient id="paint2_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(26.8161 26.6906) rotate(45) scale(22.2982)">
      <stop stop-color="#29C3FF"/>
      <stop offset="0.227273" stop-color="#4894FE"/>
      <stop offset="0.5" stop-color="#6864F6"/>
      <stop offset="0.892857" stop-color="#A931D8"/>
    </radialGradient>
    <linearGradient id="trailGradient" x1="9" y1="32" x2="55" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3BD5FF" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#B9F6FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A931D8" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="packetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(3.4)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.25" stop-color="#E7FEFF"/>
      <stop offset="0.55" stop-color="#8CEFFF"/>
      <stop offset="1" stop-color="#33D1FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-250%" y="-250%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .arm-left { transform-origin: 32px 32px; animation: armLeft 3.4s ease-in-out infinite; }
    .arm-right { transform-origin: 32px 32px; animation: armRight 3.4s ease-in-out infinite; }
    .core { transform-origin: 32px 32px; animation: coreBase 3.4s ease-in-out infinite; }
    .core-ring { transform-origin: 32px 32px; animation: coreRing 3.4s ease-in-out infinite; }
    .entry { animation: entryGlow 3.4s ease-in-out infinite; }
    .exit { animation: exitGlow 3.4s ease-in-out infinite; }
    .channel { animation: channelGlow 3.4s ease-in-out infinite; }
    .packet {
      transform-box: fill-box;
      transform-origin: center;
      animation: packetTravel 3.4s ease-in-out infinite;
    }
    .packet-trail {
      transform-box: fill-box;
      transform-origin: center;
      animation: packetTrail 3.4s ease-in-out infinite;
    }

    @keyframes armLeft {
      0%, 100% { transform: translate(0,0); }
      18% { transform: translate(-0.7px,-0.4px); }
      36%, 62% { transform: translate(-1.0px,-0.6px); }
      80% { transform: translate(-0.4px,-0.2px); }
    }
    @keyframes armRight {
      0%, 100% { transform: translate(0,0); }
      18% { transform: translate(0.7px,0.4px); }
      36%, 62% { transform: translate(1.0px,0.6px); }
      80% { transform: translate(0.4px,0.2px); }
    }
    @keyframes coreBase {
      0%,100% { transform: scale(1); }
      36%,62% { transform: scale(1.11); }
      72% { transform: scale(1.04); }
    }
    @keyframes coreRing {
      0%,18%,100% { transform: scale(0.82); opacity: 0; }
      32% { opacity: 0.18; }
      48% { transform: scale(1.55); opacity: 0.35; }
      64% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes entryGlow {
      0%,100% { opacity: 0.14; }
      8%,18% { opacity: 0.8; }
      30% { opacity: 0.18; }
    }
    @keyframes exitGlow {
      0%,72%,100% { opacity: 0.12; }
      82%,94% { opacity: 0.82; }
    }
    @keyframes channelGlow {
      0%,100% { opacity: 0.12; }
      18% { opacity: 0.18; }
      36%,62% { opacity: 0.48; }
      84% { opacity: 0.2; }
    }
    @keyframes packetTravel {
      0%   { transform: translate(9px,32px) scale(0.65); opacity: 0; }
      8%   { transform: translate(9px,32px) scale(0.9); opacity: 0.95; }
      34%  { transform: translate(25px,32px) scale(1); opacity: 1; }
      45%  { transform: translate(32px,32px) scale(1.22); opacity: 1; }
      58%  { transform: translate(32px,32px) scale(1.22); opacity: 1; }
      82%  { transform: translate(48px,32px) scale(1); opacity: 1; }
      96%  { transform: translate(55px,32px) scale(0.92); opacity: 0.9; }
      100% { transform: translate(55px,32px) scale(0.75); opacity: 0; }
    }
    @keyframes packetTrail {
      0%   { transform: translate(9px,32px) scaleX(0.2); opacity: 0; }
      8%   { transform: translate(9px,32px) scaleX(0.45); opacity: 0.25; }
      34%  { transform: translate(17px,32px) scaleX(1.1); opacity: 0.4; }
      45%  { transform: translate(22px,32px) scaleX(1.6); opacity: 0.52; }
      58%  { transform: translate(22px,32px) scaleX(1.6); opacity: 0.38; }
      82%  { transform: translate(38px,32px) scaleX(1.1); opacity: 0.3; }
      96%  { transform: translate(47px,32px) scaleX(0.45); opacity: 0.18; }
      100% { transform: translate(55px,32px) scaleX(0.2); opacity: 0; }
    }
  </style>

  <!-- logo -->
  <g class="arm-left">
    <path d="M39.4933 2.89333C37.44 1.02667 34.8 0 32 0C29.0133 0 26.2133 1.16 24.1067 3.26667L3.26667 24.1067C1.16 26.2133 0 29.0133 0 32C0 34.9867 1.16 37.7867 3.26667 39.8933L13.5467 50.1733L18 54.6267C21.0933 57.7067 25.8533 58.12 29.3867 55.8533C29.56 55.7467 29.6667 55.56 29.6933 55.36C29.7067 55.16 29.64 54.96 29.4933 54.8133L8.92 34.24C8.33333 33.64 8 32.84 8 32C8 31.16 8.33333 30.36 8.92 29.76L23.0133 15.68L29.76 8.92L31.2 7.49333C33.3867 5.30667 36.2133 4.16 39.0667 4.05333C39.3467 4.04 39.5867 3.86667 39.68 3.61333C39.76 3.36 39.6933 3.06667 39.4933 2.89333Z" fill="url(#paint0_linear)"/>
  </g>
  <g class="arm-right">
    <path d="M60.7333 24.1067L46 9.37335C42.9067 6.28002 38.1467 5.88002 34.6133 8.16002C34.44 8.26669 34.3333 8.44002 34.3067 8.64002C34.28 8.84002 34.36 9.04002 34.4933 9.18669L55.08 29.76C55.6667 30.36 56 31.16 56 32C56 32.84 55.6667 33.64 55.08 34.24L40.9867 48.32L34.24 55.08L32.8 56.5067C30.6267 58.68 27.8133 59.8267 24.96 59.96H24.92C24.6533 59.96 24.4133 60.1334 24.3333 60.3867C24.24 60.64 24.3067 60.9334 24.5067 61.1067C26.56 62.9734 29.2 64 32 64C34.9867 64 37.7867 62.84 39.8933 60.7334L60.7333 39.8934C62.84 37.7867 64 34.9867 64 32C64 29.0134 62.84 26.2134 60.7333 24.1067Z" fill="url(#paint1_linear)"/>
  </g>

  <!-- gateway channel -->
  <rect class="channel" x="9" y="31" width="46" height="2" rx="1" fill="url(#trailGradient)"/>
  <circle class="entry" cx="9" cy="32" r="2.2" fill="#3BD5FF" opacity="0.15" filter="url(#glow)"/>
  <circle class="exit" cx="55" cy="32" r="2.2" fill="#A931D8" opacity="0.12" filter="url(#glow)"/>

  <!-- center pulse -->
  <circle class="core-ring" cx="32" cy="32" r="10.6" fill="none" stroke="#B9F6FF" stroke-width="1.25" opacity="0"/>
  <g class="core">
    <path d="M32 43C38.0751 43 43 38.0751 43 32C43 25.9249 38.0751 21 32 21C25.9249 21 21 25.9249 21 32C21 38.0751 25.9249 43 32 43Z" fill="url(#paint2_radial)"/>
  </g>

  <!-- moving flash packet -->
  <g class="packet-trail" opacity="0">
    <ellipse cx="0" cy="0" rx="7.2" ry="1.35" fill="#8DEBFF" opacity="0.55" filter="url(#glow)"/>
  </g>
  <g class="packet" opacity="0" filter="url(#glow)">
    <circle cx="0" cy="0" r="2.4" fill="url(#packetGlow)"/>
    <path d="M-0.65 -2.15 L0.95 -0.25 L0.15 -0.25 L1.25 2.15 L-1.0 0.2 L-0.2 0.2 L-0.65 -2.15 Z" fill="#FFFFFF" opacity="0.98"/>
  </g>
</svg>
