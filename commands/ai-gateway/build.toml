description = "Discover an AI Gateway's models and MCP tools, retrieve a credential, and integrate them into your app — call a model, connect MCP tools, or scaffold a runnable agent."

prompt = """
Take the user all the way from discovery to working code that uses an existing
AI Gateway's models and/or MCP tools. Run the full workflow in the bundled skill
`skills/use-ai-gateway/SKILL.md` end to end:

1. **Discover & select** the models and MCP tool servers in the gateway (Part 1 of the
   skill). Use the arguments below for the target gateway (ARM `gatewayResourceId`,
   required to list assets — a host alone is not enough; resolve or ask for the id if only
   a host is given) and, if present, the desired use case. Ask the user to confirm the
   selected
   assets before continuing.
2. **Retrieve a credential** — list the gateway API keys and read the secret of the
   chosen key. The same gateway key authenticates both the model passthrough and the
   MCP tool servers, passed in the `Api-Key` header.
3. **Integrate** (Part 2 of the skill). Ask what the user is building and pick the path:
   call a model over the OpenAI-compatible passthrough, connect MCP tools from an
   MCP-capable client, or scaffold a standalone agent with the GitHub Copilot SDK
   (`github-copilot-sdk >= 1.0.0`, default Python unless the user asks for TypeScript) as
   a complete self-contained project (agent code, `.env` / `.env.example`, `.gitignore`
   ignoring `.env`, `requirements.txt` or `package.json`, and a `README.md`). Integrate
   into the user's existing project when they have one.
4. **Run and verify** the integration once and report the outcome, distinguishing genuine
   wiring bugs (`unknown_model`, `401`/`403`, missing env var) from benign backend
   conditions (`429`/quota).

Guardrails:
- Consumption only. Strictly read-only against the gateway — never issue ARM
  `PUT`/`PATCH`/`DELETE` and never create, provision, or delete gateways, models, tools,
  connections, or products. Provisioning is an administrator task done in the AI Gateway
  Portal.
- Never hardcode secrets. Read the gateway key from an environment variable and keep
  `.env` out of source control. Warn the user the written `.env` holds a live key to
  rotate in the portal if exposed.
- Use `properties.deployment.modelName` (exact dots/casing) as the model identifier —
  prefer it over the ARM `name` or `displayName` (which some gateways reject with
  `unknown_model`). Runtime calls use the gateway's `properties.gatewayUrl` host and the
  `/default/` workspace segment: `<host>/default/models/openai/v1/...` and
  `<host>/default/toolservers/<name>/mcp` (omitting `/default/` returns `404`).
- Authenticate with the `Api-Key` header — not `Authorization: Bearer` (bearer-only auth
  is rejected, typically with a `401` or a misleading `unknown_model`).

Target gateway / use case: {{args}}
"""
